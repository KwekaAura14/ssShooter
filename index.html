<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEXUS CHRONICLES - WebGL Action RPG</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        #ui {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 20;
            font-family: 'Courier New', monospace;
        }
        /* HUD Styles */
        .hud-panel {
            position: absolute;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            border-left: 3px solid #ff3366;
            padding: 8px 15px;
            border-radius: 0 8px 8px 0;
        }
        .hud-right {
            right: 20px;
            top: 20px;
            text-align: right;
            border-left: none;
            border-right: 3px solid #ff3366;
            border-radius: 8px 0 0 8px;
        }
        .bar-container {
            width: 240px;
            height: 8px;
            background: rgba(0,0,0,0.5);
            margin: 5px 0;
            border-radius: 4px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            transition: width 0.1s linear;
        }
        #hp-fill { background: linear-gradient(90deg, #ff3366, #ff6680); box-shadow: 0 0 8px #ff3366; }
        #energy-fill { background: linear-gradient(90deg, #33ccff, #66ffcc); box-shadow: 0 0 8px #33ccff; }
        #xp-fill { background: linear-gradient(90deg, #aa66ff, #ff66cc); }
        .stat-text {
            font-size: 10px;
            letter-spacing: 2px;
            color: #ddd;
            margin-bottom: 4px;
        }
        .value-large {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,100,100,0.8) 0%, rgba(255,255,255,0) 70%);
            border: 1px solid rgba(255,100,100,0.9);
            pointer-events: none;
        }
        .ability-slot {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 40px;
            backdrop-filter: blur(8px);
        }
        .ability {
            width: 50px;
            height: 50px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            background: rgba(20,20,40,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            transition: all 0.1s;
        }
        .ability.ready { border-color: #ffaa44; box-shadow: 0 0 15px rgba(255,170,0,0.5); }
        .notif {
            position: absolute;
            top: 100px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 8px 16px;
            border-left: 4px solid #ffaa44;
            font-size: 11px;
            animation: slideIn 0.3s ease;
            pointer-events: none;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .screen {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: 0.3s;
        }
        .screen.hidden { display: none; }
        .game-title {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 12px;
            background: linear-gradient(135deg, #ff3366, #33ccff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 40px rgba(255,51,102,0.3);
        }
        .menu-btn {
            margin: 12px;
            padding: 12px 32px;
            background: transparent;
            border: 1px solid #ff3366;
            color: #fff;
            font-family: monospace;
            letter-spacing: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        .menu-btn:hover {
            background: #ff3366;
            box-shadow: 0 0 20px #ff3366;
            transform: scale(1.05);
        }
        #combat-text {
            position: absolute;
            top: 40%;
            right: 10%;
            font-size: 32px;
            font-weight: bold;
            color: #ffaa44;
            text-shadow: 0 0 20px #ff6600;
            opacity: 0;
            transition: opacity 0.1s;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="hud-panel" style="top:20px; left:20px;">
            <div class="stat-text">⚡ HEALTH</div>
            <div class="bar-container"><div id="hp-fill" class="bar-fill" style="width:100%"></div></div>
            <div class="stat-text" style="margin-top:8px">🌀 ENERGY</div>
            <div class="bar-container"><div id="energy-fill" class="bar-fill" style="width:100%"></div></div>
            <div class="value-large" id="hp-value" style="font-size:18px; margin-top:4px">100</div>
        </div>
        <div class="hud-panel hud-right" style="top:20px; right:20px;">
            <div class="stat-text">🔫 WEAPON</div>
            <div id="weapon-name" style="color:#ffaa44; font-weight:bold">PLASMA BLADE</div>
            <div class="value-large" id="ammo-count" style="font-size:24px">∞</div>
            <div class="stat-text" style="margin-top:8px">✨ LEVEL <span id="level-num">1</span></div>
            <div class="bar-container" style="width:160px"><div id="xp-fill" class="bar-fill" style="width:0%"></div></div>
        </div>
        <div id="crosshair"></div>
        <div class="ability-slot" id="ability-bar"></div>
        <div id="notif-container" style="position:absolute; top:100px; right:20px;"></div>
        <div id="combat-text">x2 COMBO</div>
        <div id="boss-bar" style="position:absolute; top:80px; left:50%; transform:translateX(-50%); width:400px; display:none;">
            <div class="stat-text" id="boss-name" style="text-align:center; color:#ff6666">BOSS</div>
            <div class="bar-container"><div id="boss-hp" class="bar-fill" style="width:100%; background:#ff3366"></div></div>
        </div>
    </div>

    <div class="screen" id="menu-screen">
        <div class="game-title">NEXUS CHRONICLES</div>
        <div style="margin:20px 0; letter-spacing:4px; color:#aaa">WEBGL • TRANSFORMATION • ACTION</div>
        <button class="menu-btn" onclick="startGame()">▶ START GAME</button>
        <button class="menu-btn" onclick="showControls()">⚙ CONTROLS</button>
        <div id="controls-info" style="display:none; margin-top:20px; text-align:center; font-size:12px; color:#888">
            WASD - Move | MOUSE - Look | LEFT CLICK - Attack | SHIFT - Sprint | Q - Transform | R - Ultimate | 1-4 - Abilities
        </div>
    </div>
    <div class="screen hidden" id="death-screen">
        <div class="game-title" style="font-size:48px; color:#ff3366">DEFEATED</div>
        <button class="menu-btn" onclick="restartGame()">RESTART</button>
        <button class="menu-btn" onclick="quitToMenu()">MENU</button>
    </div>

    <!-- Import Three.js and add-ons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        // --- Setup Scene, Camera, Renderer (High Quality) ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b1a);
        scene.fog = new THREE.FogExp2(0x050b1a, 0.008);
        
        // Camera setup for first-person
        const camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 0.05, 1000);
        camera.position.set(0, 1.6, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);
        
        // Post Processing Bloom (Next-gen effect)
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.4, 0.85);
        bloomPass.threshold = 0.1;
        bloomPass.strength = 0.8;
        bloomPass.radius = 0.5;
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);
        
        // --- Lighting System (Dynamic) ---
        const ambientLight = new THREE.AmbientLight(0x222222);
        scene.add(ambientLight);
        const mainLight = new THREE.DirectionalLight(0xffcc88, 1.2);
        mainLight.position.set(5, 10, 7);
        mainLight.castShadow = true;
        mainLight.receiveShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        scene.add(mainLight);
        const fillLight = new THREE.PointLight(0x4466cc, 0.5);
        fillLight.position.set(0, 3, 0);
        scene.add(fillLight);
        const backLight = new THREE.PointLight(0xff6633, 0.4);
        backLight.position.set(-2, 2, -4);
        scene.add(backLight);
        
        // Ground with reflections (Grid + Platform)
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.4, metalness: 0.7, emissive: 0x111122 });
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.5;
        ground.receiveShadow = true;
        scene.add(ground);
        
        // Decorative grid
        const gridHelper = new THREE.GridHelper(80, 40, 0x33aaff, 0x44aaff);
        gridHelper.position.y = -0.4;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.3;
        scene.add(gridHelper);
        
        // --- Environment: Neon Trees / Crystals ---
        const crystalMat = new THREE.MeshStandardMaterial({ color: 0xaa44ff, emissive: 0x4422aa, emissiveIntensity: 0.5, metalness: 0.9 });
        for (let i = 0; i < 60; i++) {
            const crystal = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.4, 1.2, 6), crystalMat);
            const angle = Math.random() * Math.PI * 2;
            const rad = 15 + Math.random() * 25;
            crystal.position.x = Math.cos(angle) * rad;
            crystal.position.z = Math.sin(angle) * rad;
            crystal.position.y = -0.2;
            crystal.castShadow = true;
            scene.add(crystal);
        }
        
        // Floating particles (atmosphere)
        const particleCount = 800;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            particlePositions[i*3] = (Math.random() - 0.5) * 80;
            particlePositions[i*3+1] = Math.random() * 8;
            particlePositions[i*3+2] = (Math.random() - 0.5) * 60;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0x88aaff, size: 0.08, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);
        
        // --- Player Aura & Effects ---
        let currentForm = 0; // 0 = base, 1 = rage, 2 = energy
        let playerHealth = 100;
        let playerEnergy = 100;
        let playerLevel = 1;
        let playerXP = 0;
        let xpNeeded = 100;
        let combo = 0;
        let comboTime = 0;
        let transformActive = false;
        let transformGlow = null;
        
        // Create dynamic aura sphere that scales with form
        const auraMat = new THREE.MeshStandardMaterial({ color: 0x88aaff, emissive: 0x3366ff, emissiveIntensity: 0.4, transparent: true, opacity: 0.3, side: THREE.BackSide });
        const auraSphere = new THREE.Mesh(new THREE.SphereGeometry(0.9, 16, 16), auraMat);
        camera.add(auraSphere);
        scene.add(camera);
        
        // Weapon model (floating energy blade)
        const bladeMat = new THREE.MeshStandardMaterial({ color: 0xff44aa, emissive: 0xff2288, emissiveIntensity: 0.7 });
        const weaponModel = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 1.2), bladeMat);
        weaponModel.position.set(0.4, -0.3, -0.6);
        camera.add(weaponModel);
        
        // --- Enemy System ---
        class Enemy {
            constructor(x, z, type) {
                this.mesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.8), new THREE.MeshStandardMaterial({ color: 0xdd3366, emissive: 0x331122, metalness: 0.3 }));
                this.mesh.position.set(x, -0.2, z);
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = true;
                this.hp = 50 + (type === 'elite' ? 80 : 0);
                this.maxHp = this.hp;
                this.type = type;
                this.speed = 2.5;
                this.damage = 12;
                this.alive = true;
                scene.add(this.mesh);
                // Health bar above enemy
                const barCanvas = document.createElement('canvas');
                barCanvas.width = 64; barCanvas.height = 16;
                this.barTexture = new THREE.CanvasTexture(barCanvas);
                const barMat = new THREE.SpriteMaterial({ map: this.barTexture });
                this.barSprite = new THREE.Sprite(barMat);
                this.barSprite.scale.set(0.8, 0.2, 1);
                this.mesh.add(this.barSprite);
                this.updateBar();
            }
            updateBar() {
                const canvas = this.barTexture.image;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#330000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff3366';
                const percent = this.hp / this.maxHp;
                ctx.fillRect(0, 0, canvas.width * percent, canvas.height);
                this.barTexture.needsUpdate = true;
            }
            takeDamage(amt) {
                this.hp -= amt;
                this.updateBar();
                if (this.hp <= 0) this.die();
            }
            die() {
                this.alive = false;
                scene.remove(this.mesh);
                gainXP(40);
                spawnLoot(this.mesh.position.x, this.mesh.position.z);
            }
            update(delta, playerPos) {
                if (!this.alive) return;
                const dir = new THREE.Vector2(playerPos.x - this.mesh.position.x, playerPos.z - this.mesh.position.z).normalize();
                this.mesh.position.x += dir.x * this.speed * delta;
                this.mesh.position.z += dir.y * this.speed * delta;
                this.mesh.lookAt(playerPos.x, this.mesh.position.y, playerPos.z);
            }
        }
        
        let enemies = [];
        let projectiles = [];
        let lootItems = [];
        
        function spawnEnemies() {
            for (let i = 0; i < 8; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 10 + Math.random() * 12;
                const x = Math.cos(angle) * dist;
                const z = Math.sin(angle) * dist;
                const type = Math.random() > 0.7 ? 'elite' : 'normal';
                enemies.push(new Enemy(x, z, type));
            }
        }
        
        function spawnLoot(x, z) {
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshStandardMaterial({ color: 0xffaa44, emissive: 0x442200 }));
            sphere.position.set(x, 0, z);
            scene.add(sphere);
            lootItems.push({ mesh: sphere, type: 'xp', value: 25 });
        }
        
        // --- Combat & Abilities ---
        function attack() {
            if (!gameRunning) return;
            let dmg = 25 + (currentForm * 15);
            if (combo > 2) dmg *= 1.5;
            // Screen shake effect via camera position offset
            let shake = 0.1;
            camera.position.x += (Math.random() - 0.5) * shake;
            camera.position.z += (Math.random() - 0.5) * shake;
            setTimeout(() => { camera.position.x = 0; camera.position.z = 0; }, 80);
            
            // Raycast attack
            const origin = camera.getWorldPosition(new THREE.Vector3());
            const direction = camera.getWorldDirection(new THREE.Vector3());
            let hit = false;
            for (let i = 0; i < enemies.length; i++) {
                const e = enemies[i];
                if (!e.alive) continue;
                const toEnemy = e.mesh.position.clone().sub(origin);
                const dist = toEnemy.length();
                if (dist < 2.5 && direction.dot(toEnemy.normalize()) > 0.6) {
                    e.takeDamage(dmg);
                    hit = true;
                    combo++;
                    comboTime = 2.5;
                    showComboText(combo);
                    // Impact effect
                    const impactGlow = new THREE.PointLight(0xff6600, 1, 3);
                    impactGlow.position.copy(e.mesh.position);
                    scene.add(impactGlow);
                    setTimeout(() => scene.remove(impactGlow), 150);
                    break;
                }
            }
            if (!hit) combo = 0;
            // Weapon swing animation
            weaponModel.rotation.x = -0.8;
            setTimeout(() => weaponModel.rotation.x = 0, 120);
        }
        
        function useAbility(index) {
            if (!gameRunning || playerEnergy < 20) return;
            playerEnergy -= 20;
            updateUI();
            addScreenShake(0.15);
            const abilityColors = [0xff3366, 0x33ff66, 0x66aaff, 0xffaa44];
            const abilityLight = new THREE.PointLight(abilityColors[index % abilityColors.length], 1.5, 8);
            abilityLight.position.copy(camera.position);
            scene.add(abilityLight);
            setTimeout(() => scene.remove(abilityLight), 200);
            
            // Damage all nearby enemies
            for (let e of enemies) {
                if (!e.alive) continue;
                const dist = camera.position.distanceTo(e.mesh.position);
                if (dist < 5) e.takeDamage(45 + currentForm * 20);
            }
            addNotification("ABILITY BLAST!", "#ffaa44");
        }
        
        function useUltimate() {
            if (!gameRunning || playerEnergy < 50) return;
            playerEnergy -= 50;
            updateUI();
            addScreenShake(0.4);
            for (let e of enemies) {
                e.takeDamage(120 + currentForm * 40);
            }
            addNotification("⚡ ULTIMATE NEXUS STRIKE ⚡", "#ff66ff");
            // Flash effect
            document.body.style.backgroundColor = "rgba(255,100,200,0.3)";
            setTimeout(() => document.body.style.backgroundColor = "", 200);
        }
        
        function transformForm() {
            currentForm = (currentForm + 1) % 3;
            const colors = [0x88aaff, 0xff4466, 0x66ffcc];
            const intensities = [0.4, 0.9, 1.2];
            auraMat.color.setHex(colors[currentForm]);
            auraMat.emissiveIntensity = intensities[currentForm];
            addNotification(`FORM: ${currentForm === 0 ? 'BASE' : currentForm === 1 ? 'RAGE' : 'ENERGY'}`, "#ffffff");
            // Special effect: particles burst
            for (let i = 0; i < 30; i++) {
                const particle = new THREE.Mesh(new THREE.SphereGeometry(0.05, 4, 4), new THREE.MeshStandardMaterial({ color: colors[currentForm], emissive: true }));
                particle.position.copy(camera.position);
                particle.userData = { life: 0.5, velocity: new THREE.Vector3((Math.random() - 0.5) * 2, Math.random() * 2, (Math.random() - 0.5) * 2) };
                scene.add(particle);
                setTimeout(() => scene.remove(particle), 500);
            }
        }
        
        // UI Helpers
        function updateUI() {
            document.getElementById('hp-fill').style.width = `${(playerHealth / 100) * 100}%`;
            document.getElementById('energy-fill').style.width = `${(playerEnergy / 100) * 100}%`;
            document.getElementById('hp-value').innerHTML = Math.floor(playerHealth);
            document.getElementById('level-num').innerHTML = playerLevel;
            document.getElementById('xp-fill').style.width = `${(playerXP / xpNeeded) * 100}%`;
        }
        
        function gainXP(amount) {
            playerXP += amount;
            while (playerXP >= xpNeeded) {
                playerXP -= xpNeeded;
                playerLevel++;
                xpNeeded = Math.floor(xpNeeded * 1.35);
                playerHealth = Math.min(100, playerHealth + 20);
                playerEnergy = Math.min(100, playerEnergy + 15);
                addNotification(`LEVEL UP! ${playerLevel}`, "#ffcc44");
            }
            updateUI();
        }
        
        function addNotification(msg, color) {
            const div = document.createElement('div');
            div.className = 'notif';
            div.style.borderLeftColor = color;
            div.style.color = color;
            div.innerText = msg;
            document.getElementById('notif-container').appendChild(div);
            setTimeout(() => div.remove(), 2000);
        }
        
        function showComboText(val) {
            const el = document.getElementById('combat-text');
            el.innerText = `x${val} COMBO!`;
            el.style.opacity = '1';
            setTimeout(() => el.style.opacity = '0', 400);
        }
        
        function addScreenShake(intensity) {
            camera.position.x += (Math.random() - 0.5) * intensity;
            camera.position.z += (Math.random() - 0.5) * intensity;
            setTimeout(() => { camera.position.x = 0; camera.position.z = 0; }, 100);
        }
        
        // Movement & Input
        const keyState = { w: false, s: false, a: false, d: false, shift: false };
        let moveSpeed = 5.5;
        let mouseX = 0, mouseY = 0;
        let pitch = 0, yaw = -Math.PI / 4;
        let gameRunning = false;
        
        document.addEventListener('mousemove', (e) => {
            if (!gameRunning) return;
            yaw -= e.movementX * 0.003;
            pitch -= e.movementY * 0.003;
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        });
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            if (e.code === 'KeyW') keyState.w = true;
            if (e.code === 'KeyS') keyState.s = true;
            if (e.code === 'KeyA') keyState.a = true;
            if (e.code === 'KeyD') keyState.d = true;
            if (e.code === 'ShiftLeft') keyState.shift = true;
            if (e.code === 'Digit1') useAbility(0);
            if (e.code === 'Digit2') useAbility(1);
            if (e.code === 'Digit3') useAbility(2);
            if (e.code === 'Digit4') useAbility(3);
            if (e.code === 'KeyR') useUltimate();
            if (e.code === 'KeyQ') transformForm();
            if (e.code === 'Space') attack();
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keyState.w = false;
            if (e.code === 'KeyS') keyState.s = false;
            if (e.code === 'KeyA') keyState.a = false;
            if (e.code === 'KeyD') keyState.d = false;
            if (e.code === 'ShiftLeft') keyState.shift = false;
        });
        document.addEventListener('click', () => {
            if (gameRunning) attack();
        });
        
        function updateMovement(delta) {
            if (!gameRunning) return;
            let speed = moveSpeed * (keyState.shift ? 2.2 : 1.0) * (currentForm === 2 ? 1.5 : 1.0);
            const forward = camera.getWorldDirection(new THREE.Vector3());
            const right = new THREE.Vector3().crossVectors(camera.up, forward).normalize();
            let move = new THREE.Vector3(0, 0, 0);
            if (keyState.w) move.z -= 1;
            if (keyState.s) move.z += 1;
            if (keyState.a) move.x -= 1;
            if (keyState.d) move.x += 1;
            move.normalize();
            const vel = new THREE.Vector3();
            vel.addScaledVector(forward, move.z * speed * delta);
            vel.addScaledVector(right, move.x * speed * delta);
            camera.position.add(vel);
            // Boundary
            camera.position.x = Math.max(-28, Math.min(28, camera.position.x));
            camera.position.z = Math.max(-28, Math.min(28, camera.position.z));
            
            // Update particle system rotation for aesthetics
            particles.rotation.y += 0.005;
        }
        
        // Boss Spawn logic
        let boss = null;
        function spawnBoss() {
            if (boss) return;
            const bossMesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.2, 1.5), new THREE.MeshStandardMaterial({ color: 0xdd1144, emissive: 0x441122, metalness: 0.8 }));
            bossMesh.position.set(12, -0.3, 10);
            bossMesh.castShadow = true;
            scene.add(bossMesh);
            boss = { mesh: bossMesh, hp: 300, maxHp: 300, alive: true };
            document.getElementById('boss-bar').style.display = 'block';
            document.getElementById('boss-name').innerText = "★ VOID TITAN ★";
            addNotification("BOSS APPROACHES!", "#ff3366");
        }
        
        function updateBoss() {
            if (boss && boss.alive) {
                const percent = boss.hp / boss.maxHp;
                document.getElementById('boss-hp').style.width = `${percent * 100}%`;
                if (boss.hp <= 0) {
                    scene.remove(boss.mesh);
                    boss = null;
                    document.getElementById('boss-bar').style.display = 'none';
                    gainXP(300);
                    addNotification("BOSS DEFEATED! EPIC LOOT!", "#ffaa44");
                }
            }
        }
        
        // Game Loop
        let lastTime = 0;
        function animate(time) {
            requestAnimationFrame(animate);
            const delta = Math.min(0.033, (time - lastTime) / 1000);
            lastTime = time;
            if (!gameRunning) {
                effectComposer.render();
                return;
            }
            updateMovement(delta);
            // Update enemies AI
            for (let i = 0; i < enemies.length; i++) {
                const e = enemies[i];
                e.update(delta, camera.position);
                // Enemy attack
                if (e.alive && camera.position.distanceTo(e.mesh.position) < 1.2) {
                    playerHealth -= e.damage * delta * 2;
                    if (playerHealth <= 0) die();
                    updateUI();
                    addScreenShake(0.08);
                }
            }
            // Clean dead enemies
            enemies = enemies.filter(e => e.alive);
            // Loot collection
            for (let i = 0; i < lootItems.length; i++) {
                const loot = lootItems[i];
                if (camera.position.distanceTo(loot.mesh.position) < 1.2) {
                    scene.remove(loot.mesh);
                    lootItems.splice(i, 1);
                    gainXP(20);
                    addNotification("+20 XP", "#88ff88");
                    break;
                }
            }
            // Spawn boss condition
            if (enemies.length === 0 && !boss && gameRunning) {
                spawnBoss();
                spawnEnemies();
            }
            if (boss && boss.alive && camera.position.distanceTo(boss.mesh.position) < 2) {
                playerHealth -= 35 * delta;
                updateUI();
                if (playerHealth <= 0) die();
            }
            updateBoss();
            // Regeneration
            playerHealth = Math.min(100, playerHealth + 8 * delta);
            playerEnergy = Math.min(100, playerEnergy + 12 * delta);
            if (comboTime > 0) comboTime -= delta; else combo = 0;
            updateUI();
            // Aura intensity based on form
            auraMat.emissiveIntensity = 0.4 + currentForm * 0.5 + Math.sin(time * 0.01) * 0.1;
            
            effectComposer.render();
        }
        
        function die() {
            gameRunning = false;
            document.getElementById('death-screen').classList.remove('hidden');
        }
        
        function startGame() {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('death-screen').classList.add('hidden');
            gameRunning = true;
            playerHealth = 100; playerEnergy = 100; playerLevel = 1; playerXP = 0; currentForm = 0;
            enemies.forEach(e => scene.remove(e.mesh));
            enemies = [];
            lootItems.forEach(l => scene.remove(l.mesh));
            lootItems = [];
            if (boss) scene.remove(boss.mesh);
            boss = null;
            camera.position.set(0, 1.6, 0);
            yaw = -Math.PI/4; pitch = 0;
            camera.rotation.y = yaw; camera.rotation.x = pitch;
            spawnEnemies();
            updateUI();
            addNotification("NEXUS POWER ACTIVATED", "#66ccff");
        }
        
        window.startGame = startGame;
        window.restartGame = () => { startGame(); };
        window.quitToMenu = () => {
            gameRunning = false;
            document.getElementById('menu-screen').classList.remove('hidden');
            document.getElementById('death-screen').classList.add('hidden');
        };
        window.showControls = () => {
            const ctrl = document.getElementById('controls-info');
            ctrl.style.display = ctrl.style.display === 'none' ? 'block' : 'none';
        };
        
        // Initialize abilities UI
        const abilityNames = ["NEXUS SLASH", "ENERGY WAVE", "COSMIC SHIELD", "VOID STRIKE"];
        const bar = document.getElementById('ability-bar');
        abilityNames.forEach((name, i) => {
            const div = document.createElement('div');
            div.className = 'ability ready';
            div.innerHTML = `<span style="font-size:16px">${i+1}</span><span style="font-size:7px">${name}</span>`;
            bar.appendChild(div);
        });
        
        animate(0);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effectComposer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Initial menu state
        gameRunning = false;
    </script>
</body>
</html>

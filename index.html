<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS STRIKE — AAA Futuristic FPS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
  #canvas { display: block; width: 100vw; height: 100vh; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  /* Crosshair */
  #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }
  .ch-line { position: absolute; background: rgba(0,255,200,0.9); border-radius: 2px; transition: all 0.05s; }
  #ch-top    { width:2px; height:10px; top:-18px; left:-1px; }
  #ch-bottom { width:2px; height:10px; top:8px;   left:-1px; }
  #ch-left   { width:10px; height:2px; left:-18px; top:-1px; }
  #ch-right  { width:10px; height:2px; left:8px;   top:-1px; }
  #ch-dot    { width:4px;  height:4px; border-radius:50%; background:rgba(0,255,200,0.6); top:-2px; left:-2px; }
  #crosshair.ads .ch-line { opacity:0; }
  #crosshair.ads #ch-dot { opacity:1; background:rgba(255,80,80,0.9); width:6px; height:6px; top:-3px; left:-3px; }

  /* Damage vignette */
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(255,0,0,0) 70%);
    z-index: 9; transition: background 0.1s; }
  #vignette.hit { background: radial-gradient(ellipse at center, transparent 40%, rgba(255,0,0,0.7) 100%); }
  #vignette.low { background: radial-gradient(ellipse at center, transparent 30%, rgba(200,0,0,0.4) 100%);
    animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  /* Bottom HUD bar */
  #hud-bottom { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px 40px;
    display: flex; justify-content: space-between; align-items: flex-end; }

  /* Health */
  #health-block { display: flex; flex-direction: column; gap: 4px; }
  .hud-label { font-size: 9px; letter-spacing: 3px; color: rgba(0,255,200,0.5); text-transform: uppercase; }
  #health-bar-outer { width: 220px; height: 6px; background: rgba(255,255,255,0.1);
    border: 1px solid rgba(0,255,200,0.3); position: relative; overflow: hidden; }
  #health-bar { height: 100%; background: linear-gradient(90deg, #00ffc8, #00c8ff);
    transition: width 0.3s; box-shadow: 0 0 8px #00ffc8; }
  #health-val { font-size: 28px; font-weight: bold; color: #00ffc8; letter-spacing: 2px;
    text-shadow: 0 0 10px #00ffc8; margin-top: 2px; }

  /* Shield */
  #shield-block { display: flex; flex-direction: column; gap: 4px; }
  #shield-bar-outer { width: 220px; height: 4px; background: rgba(255,255,255,0.1);
    border: 1px solid rgba(100,150,255,0.3); overflow: hidden; }
  #shield-bar { height: 100%; background: linear-gradient(90deg, #4488ff, #aa44ff);
    transition: width 0.3s; box-shadow: 0 0 8px #4488ff; }

  /* Ammo */
  #ammo-block { text-align: right; }
  #ammo-val { font-size: 42px; font-weight: bold; color: #fff; letter-spacing: -2px; }
  #ammo-reserve { font-size: 18px; color: rgba(255,255,255,0.4); }
  #weapon-name { font-size: 10px; letter-spacing: 4px; color: rgba(255,200,0,0.8); text-transform: uppercase; margin-bottom: 4px; }

  /* Wave / Score top center */
  #hud-top-center { position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    text-align: center; }
  #wave-label { font-size: 9px; letter-spacing: 4px; color: rgba(255,200,0,0.6); }
  #wave-val { font-size: 24px; font-weight: bold; color: #ffcc00; text-shadow: 0 0 12px #ffcc00; }
  #score-val { font-size: 12px; color: rgba(255,255,255,0.5); letter-spacing: 2px; }

  /* Kill feed top right */
  #killfeed { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 4px; }
  .kf-entry { font-size: 11px; color: #ff4444; letter-spacing: 1px;
    background: rgba(0,0,0,0.5); padding: 4px 10px; border-left: 2px solid #ff4444;
    animation: kfFade 3s forwards; }
  @keyframes kfFade { 0%{opacity:1;transform:translateX(0)} 80%{opacity:1} 100%{opacity:0;transform:translateX(20px)} }

  /* Hit marker */
  #hitmarker { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 30px; height: 30px; pointer-events: none; opacity: 0; transition: opacity 0.05s; }
  #hitmarker.show { opacity: 1; animation: hm 0.2s forwards; }
  @keyframes hm { 0%{opacity:1;transform:translate(-50%,-50%) scale(1)} 100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)} }
  .hm-line { position: absolute; background: #fff; }
  #hm-tl { width:8px;height:2px;top:4px;left:4px;transform:rotate(45deg); }
  #hm-tr { width:8px;height:2px;top:4px;right:4px;transform:rotate(-45deg); }
  #hm-bl { width:8px;height:2px;bottom:4px;left:4px;transform:rotate(-45deg); }
  #hm-br { width:8px;height:2px;bottom:4px;right:4px;transform:rotate(45deg); }

  /* Reload indicator */
  #reload-bar { position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%);
    display: none; flex-direction: column; align-items: center; gap: 4px; }
  #reload-bar.show { display: flex; }
  #reload-track { width: 150px; height: 3px; background: rgba(255,255,255,0.2); }
  #reload-fill { height: 100%; background: #ffcc00; width: 0%; transition: width linear; }
  #reload-text { font-size: 9px; letter-spacing: 3px; color: rgba(255,200,0,0.8); }

  /* Enemy alert icons */
  #threat-indicators { position: absolute; inset: 0; }
  .threat-arrow { position: absolute; width: 30px; height: 30px; pointer-events: none; }

  /* Minimap */
  #minimap { position: absolute; top: 20px; left: 20px;
    width: 150px; height: 150px; border-radius: 4px;
    background: rgba(0,0,0,0.7); border: 1px solid rgba(0,255,200,0.3); overflow: hidden; }
  #minimap canvas { width: 100%; height: 100%; }
  #minimap-label { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
    font-size: 8px; letter-spacing: 2px; color: rgba(0,255,200,0.4); }

  /* Weapon selector */
  #weapon-selector { position: absolute; right: 40px; bottom: 130px;
    display: flex; flex-direction: column; gap: 6px; }
  .wp-slot { font-size: 9px; letter-spacing: 2px; color: rgba(255,255,255,0.3);
    padding: 4px 10px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.3); text-align: right; transition: all 0.15s; }
  .wp-slot.active { color: #ffcc00; border-color: rgba(255,200,0,0.5);
    background: rgba(255,200,0,0.1); text-shadow: 0 0 8px #ffcc00; }

  /* Objective */
  #objective { position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: 3px; color: rgba(255,255,255,0.4); white-space: nowrap; }

  /* Screen flash */
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 20; transition: opacity 0.1s; }

  /* Death / Game menu screens */
  #overlay { position: fixed; inset: 0; z-index: 100; display: none;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
    flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
  #overlay.show { display: flex; }
  #overlay h1 { font-size: 64px; letter-spacing: 8px; color: #00ffc8;
    text-shadow: 0 0 30px #00ffc8, 0 0 60px #00ffc8; font-weight: 900; }
  #overlay h2 { font-size: 18px; letter-spacing: 4px; color: rgba(255,255,255,0.5); }
  #overlay .stat { font-size: 14px; letter-spacing: 2px; color: rgba(255,255,255,0.6); }
  .btn { padding: 14px 40px; border: 1px solid rgba(0,255,200,0.5); background: rgba(0,255,200,0.1);
    color: #00ffc8; font-size: 12px; letter-spacing: 4px; cursor: pointer; text-transform: uppercase;
    transition: all 0.2s; pointer-events: all; font-family: 'Courier New', monospace; }
  .btn:hover { background: rgba(0,255,200,0.2); border-color: #00ffc8; box-shadow: 0 0 20px rgba(0,255,200,0.3); }

  /* Wave incoming banner */
  #wave-banner { position: fixed; top: 35%; left: 50%; transform: translate(-50%,-50%);
    z-index: 50; pointer-events: none; opacity: 0; text-align: center; }
  #wave-banner.show { animation: wb 3s forwards; }
  @keyframes wb { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)} 20%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    70%{opacity:1} 100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)} }
  #wave-banner h2 { font-size: 48px; letter-spacing: 10px; color: #ffcc00;
    text-shadow: 0 0 30px #ffcc00; font-weight: 900; }
  #wave-banner p { font-size: 12px; letter-spacing: 4px; color: rgba(255,200,0,0.6); margin-top: 4px; }

  /* Low ammo warning */
  #low-ammo { position: absolute; bottom: 165px; right: 40px; font-size: 9px;
    letter-spacing: 3px; color: #ff4444; opacity: 0; transition: opacity 0.3s;
    animation: lowAmmo 0.5s ease-in-out infinite alternate; }
  #low-ammo.show { opacity: 1; }
  @keyframes lowAmmo { from{opacity:0.5} to{opacity:1} }

  /* Pickup notification */
  #pickup-notif { position: absolute; bottom: 200px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 3px; color: #00ffc8; opacity: 0; transition: opacity 0.3s;
    white-space: nowrap; }
  #pickup-notif.show { opacity: 1; }

  /* Boss health bar */
  #boss-bar { position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
    width: 400px; display: none; flex-direction: column; align-items: center; gap: 4px; }
  #boss-bar.show { display: flex; }
  #boss-name-label { font-size: 10px; letter-spacing: 4px; color: #ff4444; }
  #boss-bar-outer { width: 100%; height: 8px; background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,50,50,0.5); }
  #boss-bar-fill { height: 100%; background: linear-gradient(90deg,#ff0000,#ff6600);
    transition: width 0.3s; box-shadow: 0 0 10px #ff0000; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<!-- HUD -->
<div id="hud">
  <!-- Crosshair -->
  <div id="crosshair">
    <div class="ch-line" id="ch-top"></div>
    <div class="ch-line" id="ch-bottom"></div>
    <div class="ch-line" id="ch-left"></div>
    <div class="ch-line" id="ch-right"></div>
    <div class="ch-line" id="ch-dot"></div>
  </div>

  <!-- Hit marker -->
  <div id="hitmarker">
    <div class="hm-line" id="hm-tl"></div>
    <div class="hm-line" id="hm-tr"></div>

    <div class="hm-line" id="hm-br"></div>

  <!-- Minimap -->
  <div id="minimap">

  <!-- Top center -->
  <div id="hud-top-center">

  <div id="killfeed"></div>

  <div id="pickup-notif"></div>

  <div id="weapon-selector">
    <div class="wp-slot active" id="ws-0">1 · PULSE RIFLE</div>
    <div class="wp-slot" id="ws-1">2 · NOVA SHOTGUN</div>
    <div class="wp-slot" id="ws-2">3 · RAIL SNIPER</div>
    <div class="wp-slot" id="ws-3">4 · PLASMA CANNON</div>
  </div>

  <!-- Bottom HUD -->
  <div id="hud-bottom">
    <div id="health-block">
      <div class="hud-label">// HEALTH</div>
      <div id="health-bar-outer"><div id="health-bar" style="width:100%"></div></div>
      <div id="health-val">100</div>
      <div class="hud-label" style="margin-top:6px;">// SHIELD</div>
      <div id="shield-bar-outer"><div id="shield-bar" style="width:100%"></div></div>
    </div>
    <div id="ammo-block">
      <div id="weapon-name">PULSE RIFLE</div>
      <div id="ammo-val">30</div>
      <div id="ammo-reserve">/ 120</div>
    </div>

  <!-- Threat indicators -->
  <div id="threat-indicators"></div>
</div>

<!-- Damage vignette -->
<div id="vignette"></div>
<!-- Screen flash -->
<div id="flash"></div>

<!-- Wave banner -->
<div id="wave-banner">
  <h2>WAVE <span id="banner-wave-num">1</span></h2>
  <p>ENGAGE AND ELIMINATE</p>
</div>

<!-- Overlay -->
<div id="overlay">
  <h1 id="overlay-title">NEXUS STRIKE</h1>
  <h2 id="overlay-sub">FUTURISTIC COMBAT ARENA</h2>
  <div class="stat" id="overlay-stats"></div>
  <button class="btn" id="overlay-btn" onclick="startGame()">▶ DEPLOY</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// NEXUS STRIKE — AAA FPS Game Engine
// ============================================================

const canvas = document.getElementById('canvas');
const W = () => window.innerWidth, H = () => window.innerHeight;

// --- Three.js Setup ---
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(W(), H());
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a1a, 0.018);

const camera = new THREE.PerspectiveCamera(75, W()/H(), 0.1, 300);
camera.position.set(0, 1.7, 0);

// Minimap
const mmCanvas = document.getElementById('minimap-canvas');
const mmCtx = mmCanvas.getContext('2d');

// ============================================================
// AUDIO ENGINE
// ============================================================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function getAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  return audioCtx;
}

function playTone(freq, type, dur, vol, detune=0, distort=0) {
  try {
    const ac = getAudio();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.detune.value = detune;
    gain.gain.setValueAtTime(vol, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    if (distort) {
      const dist = ac.createWaveShaper();
      const k = distort * 200;
      const n = 256, curve = new Float32Array(n);
      for (let i=0;i<n;i++){const x=i*2/n-1;curve[i]=(Math.PI+k)*x/(Math.PI+k*Math.abs(x));}
      dist.curve = curve;
      osc.connect(dist); dist.connect(gain);
    } else { osc.connect(gain); }
    gain.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime + dur);
  } catch(e){}
}

function playNoise(dur, vol, freq=2000, q=1) {
  try {
    const ac = getAudio();
    const buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    const src = ac.createBufferSource();
    src.buffer = buf;
    const filt = ac.createBiquadFilter();
    filt.type = 'bandpass';
    filt.frequency.value = freq;
    filt.Q.value = q;
    const gain = ac.createGain();
    gain.gain.setValueAtTime(vol, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    src.connect(filt); filt.connect(gain); gain.connect(ac.destination);
    src.start(); src.stop(ac.currentTime + dur);
  } catch(e){}
}

const Sounds = {
  rifleShot()  { playNoise(0.08,1.5,3000,3); playTone(90,'sawtooth',0.15,0.4,0,1); playTone(180,'square',0.05,0.2); },
  shotgunShot(){ playNoise(0.12,2,1800,2); playTone(60,'sawtooth',0.2,0.6,0,1.5); for(let i=0;i<5;i++) playNoise(0.06,0.8,2000+Math.random()*2000,4); },
  sniperShot() { playNoise(0.05,1.2,5000,8); playTone(220,'sawtooth',0.4,0.8,-200,0.8); playTone(110,'square',0.3,0.4); },
  plasmaShot() { playTone(800,'sine',0.1,0.6); playTone(400,'square',0.2,0.5,-300); playNoise(0.15,0.6,8000,5); },
  reload()     { playTone(300,'square',0.05,0.3); setTimeout(()=>playTone(500,'square',0.05,0.3),150); setTimeout(()=>playTone(200,'square',0.08,0.4),300); },
  hit()        { playNoise(0.05,0.8,800,5); playTone(200,'square',0.05,0.3); },
  death()      { playNoise(0.3,0.8,400,2); playTone(100,'sawtooth',0.5,0.5,0,1); },
  explosion()  { playNoise(0.5,2,500,1); playTone(50,'sawtooth',0.6,0.8,0,2); for(let i=0;i<3;i++) setTimeout(()=>playNoise(0.2,0.5,300,2),i*100); },
  pickup()     { playTone(600,'sine',0.1,0.4); playTone(900,'sine',0.1,0.4); playTone(1200,'sine',0.2,0.3); },
  footstep()   { playNoise(0.04,0.15,200,8); },
  shieldRegen(){ playTone(1000,'sine',0.3,0.2,500); },
  bossRoar()   { playNoise(0.8,1.5,200,1); playTone(40,'sawtooth',1,0.8,0,2); }
};

// ============================================================
// WEAPON DEFINITIONS
// ============================================================
const WEAPONS = [
  { name:'PULSE RIFLE',   key:'1', ammo:30, reserve:120, rpm:600, damage:18, spread:0.02, reload:2.0, range:200, type:'hitscan', auto:true,  recoil:0.015, color:0x00ffcc },
  { name:'NOVA SHOTGUN',  key:'2', ammo:8,  reserve:40,  rpm:80,  damage:15, spread:0.08, reload:2.5, range:30,  type:'hitscan', auto:false, pellets:8, recoil:0.05,  color:0xff6600 },
  { name:'RAIL SNIPER',   key:'3', ammo:5,  reserve:20,  rpm:40,  damage:90, spread:0.002,reload:3.0, range:300, type:'hitscan', auto:false, recoil:0.08,  color:0xaaffff },
  { name:'PLASMA CANNON', key:'4', ammo:20, reserve:80,  rpm:120, damage:35, spread:0.04, reload:2.8, range:150, type:'projectile',auto:false,recoil:0.04,  color:0xff00ff, projSpeed:80, aoe:3 }
];

// ============================================================
// PLAYER STATE
// ============================================================
const Player = {
  health: 100, maxHealth: 100,
  shield: 100, maxShield: 100,
  speed: 6, sprintMult: 1.6, crouchMult: 0.5,
  weapons: WEAPONS.map(w=>({...w, curAmmo:w.ammo, curReserve:w.reserve})),
  currentWeapon: 0,
  alive: true, dead: false,
  score: 0, kills: 0, wave: 1,
  sprinting: false, crouching: false, jumping: false, ads: false,
  reloading: false, reloadTimer: 0,
  canShoot: true, shootCooldown: 0,
  yVel: 0, onGround: true,
  pos: new THREE.Vector3(0, 1.7, 0),
  yaw: 0, pitch: 0,
  bobTimer: 0, isMoving: false,
  shieldRegenTimer: 0,
  slowMoTimer: 0, slowMoMax: 300,
  respawnTimer: 0,
};

// ============================================================
// INPUT
// ============================================================
const Keys = {};
const Mouse = { x:0, y:0, down:false, right:false };
let pointerLocked = false;

document.addEventListener('keydown', e => { Keys[e.code]=true; if(e.code==='Tab') e.preventDefault(); });
document.addEventListener('keyup',   e => { Keys[e.code]=false; });
document.addEventListener('mousedown', e => { Mouse.down = e.button===0; Mouse.right = e.button===2; });
document.addEventListener('mouseup',   e => { if(e.button===0) Mouse.down=false; if(e.button===2) Mouse.right=false; });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('mousemove', e => {
  if (!pointerLocked) return;
  const sens = 0.0018 * (Player.ads ? 0.4 : 1.0);
  Player.yaw   -= e.movementX * sens;
  Player.pitch -= e.movementY * sens;
  Player.pitch  = Math.max(-1.4, Math.min(1.4, Player.pitch));
});
canvas.addEventListener('click', () => { canvas.requestPointerLock(); });
document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === canvas;
});

// Weapon switch
document.addEventListener('keydown', e => {
  if (e.code === 'Digit1') switchWeapon(0);
  if (e.code === 'Digit2') switchWeapon(1);
  if (e.code === 'Digit3') switchWeapon(2);
  if (e.code === 'Digit4') switchWeapon(3);
  if (e.code === 'KeyR')   startReload();
  if (e.code === 'KeyF')   toggleSlowMo();
  if (e.code === 'Space')  tryJump();
});

// ============================================================
// WORLD BUILDING
// ============================================================
// Materials
const matFloor = new THREE.MeshStandardMaterial({ color:0x111122, roughness:0.8, metalness:0.2 });
const matWall  = new THREE.MeshStandardMaterial({ color:0x151530, roughness:0.7, metalness:0.3 });
const matGlass = new THREE.MeshStandardMaterial({ color:0x003355, roughness:0, metalness:0.8, transparent:true, opacity:0.3 });
const matEmit  = new THREE.MeshStandardMaterial({ color:0x002244, emissive:0x003388, emissiveIntensity:2 });
const matRed   = new THREE.MeshStandardMaterial({ color:0x220000, emissive:0xff2200, emissiveIntensity:1.5 });

function box(w,h,d,mat,x,y,z,rx=0,ry=0,rz=0,castShadow=true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.rotation.set(rx,ry,rz);
  m.castShadow = castShadow; m.receiveShadow = true;
  scene.add(m); return m;
}

  const wm = matWall;

    });
    box(0.2, h, 0.2, stripMat, x+6, h/2, z+6);
    box(0.2, h, 0.2, stripMat, x-6, h/2, z-6);
  });

  // Cover objects — crates, barriers
  const coverPositions = [
    [12,0,0],[−12,0,0],[0,0,15],[0,0,-15],[20,0,20],[-20,0,20],[20,0,-20],[-20,0,-20],
    [30,0,10],[-30,0,10],[30,0,-10],[-30,0,-10],
    [8,0,30],[-8,0,30],[8,0,-30],[-8,0,-30],
    [35,0,35],[-35,0,35],[35,0,-35],[-35,0,-35],
  ];
  coverPositions.forEach(([x,,z],i) => {
    const h = 1.2 + Math.random()*1.4;

      color:[0x223344,0x334422,0x442233,0x224433][i%4], roughness:0.8, metalness:0.5
    });

    coverObjects.push({ pos: new THREE.Vector3(x, h/2, z), size: new THREE.Vector3(3,h,3) });

  // Elevated platforms
  [[-25,0],[25,0],[0,25],[0,-25]].forEach(([x,z],i) => {
    box(12,0.5,12,wm,x,3,z);
    // Ramps
    box(3,3,8,wm,x+(i%2===0?6:-6),1.5,z,0,0,Math.PI/8*(i%2===0?-1:1));

  // Pickup pads (health, ammo, shield)

  // Atmospheric columns

function createPickupPad(pos, type, color) {
  const padMat = new THREE.MeshStandardMaterial({color:0x001122, emissive:color, emissiveIntensity:1.5, transparent:true, opacity:0.7});
  const pad = new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,0.1,16), padMat);
  pad.position.copy(pos);
  scene.add(pad);
  const iconMat = new THREE.MeshStandardMaterial({emissive:color, emissiveIntensity:4, color:0x000000});
  const icon = new THREE.Mesh(new THREE.TorusGeometry(1,0.1,8,32), iconMat);
  icon.position.copy(pos); icon.position.y += 0.5; icon.rotation.x = Math.PI/2;
  scene.add(icon);
  const pl = new THREE.PointLight(color, 2, 6);
  pl.position.copy(pos); pl.position.y += 1;
  scene.add(pl);
  pickups.push({ pos: pos.clone(), type, mesh: pad, icon, light: pl, cooldown:0 });
}

const particleSystems = [];

function createAmbientParticles() {
  const geo = new THREE.BufferGeometry();
  const cnt = 2000;
  const pos = new Float32Array(cnt*3);
  for (let i=0;i<cnt;i++) {
    pos[i*3]   = (Math.random()-0.5)*180;
    pos[i*3+1] = Math.random()*40;
    pos[i*3+2] = (Math.random()-0.5)*180;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({ color:0x224488, size:0.08, transparent:true, opacity:0.6 });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  particleSystems.push({ type:'ambient', mesh:pts, timer:0 });
}

function spawnExplosion(pos, radius=3, color=0xff4400) {
  const cnt = 60;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(cnt*3);
  const velocities = [];
  for (let i=0;i<cnt;i++) {
    positions[i*3]=pos.x; positions[i*3+1]=pos.y; positions[i*3+2]=pos.z;
    velocities.push(new THREE.Vector3((Math.random()-0.5)*radius*3,(Math.random()*radius*2),(Math.random()-0.5)*radius*3));
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  const mat = new THREE.PointsMaterial({ color, size:0.3, transparent:true });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);

  // Flash light
  const fl = new THREE.PointLight(color, 10, radius*5);
  fl.position.copy(pos); scene.add(fl);

  particleSystems.push({ type:'explosion', mesh:pts, velocities, timer:0, maxTime:1.5, light:fl, pos });
  Sounds.explosion();
}

function spawnBulletImpact(pos, normal, color=0xffaa00) {
  const cnt = 12;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(cnt*3);
  const velocities = [];
  for (let i=0;i<cnt;i++) {
    positions[i*3]=pos.x; positions[i*3+1]=pos.y; positions[i*3+2]=pos.z;
    const v = new THREE.Vector3((Math.random()-0.5)*6,(Math.random()*4),(Math.random()-0.5)*6);
    velocities.push(v);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  const mat = new THREE.PointsMaterial({ color, size:0.08, transparent:true });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  particleSystems.push({ type:'sparks', mesh:pts, velocities, timer:0, maxTime:0.6 });
}

function spawnBloodEffect(pos) {
  const cnt = 20;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(cnt*3);
  const velocities = [];
  for (let i=0;i<cnt;i++) {
    positions[i*3]=pos.x; positions[i*3+1]=pos.y+1; positions[i*3+2]=pos.z;
    velocities.push(new THREE.Vector3((Math.random()-0.5)*4,(Math.random()*5),(Math.random()-0.5)*4));
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  const mat = new THREE.PointsMaterial({ color:0xff0000, size:0.12, transparent:true });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  particleSystems.push({ type:'blood', mesh:pts, velocities, timer:0, maxTime:0.8 });
}

function spawnMuzzleFlash(pos, color) {
  muzzleLight.color.setHex(color);
  muzzleLight.intensity = 15;
  muzzleLight.position.copy(pos);
  setTimeout(() => { muzzleLight.intensity = 0; }, 50);
}

function spawnTracer(start, end, color) {
  const dir = end.clone().sub(start);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(0.015, 0.015, len, 4);
  const mat = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.8 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(start).add(dir.multiplyScalar(0.5));
  mesh.lookAt(end);
  mesh.rotateX(Math.PI/2);
  scene.add(mesh);
  particleSystems.push({ type:'tracer', mesh, timer:0, maxTime:0.08 });
}

const enemies = [];
let enemyIdCounter = 0;

const EnemyTypes = {
  grunt:  { health:60,  speed:3.5, damage:8,  range:25, rpm:120, color:0xff2200, scale:1,    score:100 },
  heavy:  { health:200, speed:2.0, damage:15, range:20, rpm:60,  color:0xff6600, scale:1.3,  score:250 },
  sniper: { health:40,  speed:2.5, damage:40, range:80, rpm:30,  color:0x8800ff, scale:0.9,  score:200 },
  flanker:{ health:50,  speed:5.5, damage:10, range:15, rpm:180, color:0x0088ff, scale:0.85, score:150 },
  boss:   { health:2000,speed:2.5, damage:25, range:40, rpm:90,  color:0xff0000, scale:2.2,  score:1000 }
};

function spawnEnemy(type='grunt', pos) {
  const def = EnemyTypes[type];
  const h = def.scale * 1.8;
  const group = new THREE.Group();

  // Body
  const bodyMat = new THREE.MeshStandardMaterial({ color:def.color, roughness:0.5, metalness:0.7 });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry ? new THREE.CapsuleGeometry(0.35*def.scale, 0.9*def.scale, 4, 8) : new THREE.CylinderGeometry(0.35*def.scale, 0.35*def.scale, 0.9*def.scale), bodyMat);
  body.position.y = 0.45*def.scale + 0.45*def.scale;
  body.castShadow = true;
  group.add(body);

  // Head
  const headMat = new THREE.MeshStandardMaterial({ color:def.color, roughness:0.3, metalness:0.8,
    emissive:def.color, emissiveIntensity:0.3 });
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.28*def.scale, 8, 8), headMat);
  head.position.y = h * 0.9;
  head.castShadow = true;
  group.add(head);

  // Eyes glow
  const eyeMat = new THREE.MeshStandardMaterial({ color:0x000000, emissive:0xffffff, emissiveIntensity:3 });
  [-1,1].forEach(side => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.06*def.scale, 6, 6), eyeMat);
    eye.position.set(side*0.12*def.scale, h*0.9+0.04, 0.22*def.scale);
    group.add(eye);
  });

  // Weapon arm
  const armMat = new THREE.MeshStandardMaterial({ color:0x333344, metalness:0.9, roughness:0.2 });
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.15*def.scale, 0.5*def.scale, 0.15*def.scale), armMat);
  arm.position.set(0.5*def.scale, h*0.6, 0.2*def.scale);
  group.add(arm);

  // Gun barrel
  const gunMat = new THREE.MeshStandardMaterial({ color:0x222233, metalness:1, roughness:0.1 });
  const gun = new THREE.Mesh(new THREE.CylinderGeometry(0.06*def.scale, 0.06*def.scale, 0.5*def.scale, 6), gunMat);
  gun.rotation.z = Math.PI/2;
  gun.position.set(0.8*def.scale, h*0.6, 0.2*def.scale);
  group.add(gun);

  // Point light
  const light = new THREE.PointLight(def.color, 1, 4);
  light.position.y = h*0.5;
  group.add(light);

  group.position.copy(pos || new THREE.Vector3((Math.random()-0.5)*80, 0, (Math.random()-0.5)*80));
  group.position.y = 0;
  scene.add(group);

  const enemy = {
    id: enemyIdCounter++,
    type, def,
    mesh: group, body, head,
    health: def.health, maxHealth: def.health,
    speed: def.speed, damage: def.damage,
    shootRange: def.range, shootCooldown: 0,
    state: 'patrol',
    patrolTarget: null, patrolTimer: 0,
    coverPos: null, coverTimer: 0,
    lastSeenPlayer: null,
    alive: true, dying: false,
    deathTimer: 0,
    alertTimer: 0,
    flankTimer: 0,
    bobTimer: Math.random()*10,
    shootTimer: 0,
    hitFlashTimer: 0,
    pos: group.position,
    isBoss: type==='boss',
  };

  enemies.push(enemy);
  return enemy;
}

let waveActive = false;
let waveEnemiesLeft = 0;
let bossSpawned = false;

function startWave(wave) {
  Player.wave = wave;
  document.getElementById('wave-val').textContent = wave;
  document.getElementById('banner-wave-num').textContent = wave;
  const banner = document.getElementById('wave-banner');
  banner.classList.add('show');
  setTimeout(() => banner.classList.remove('show'), 3000);

  waveActive = true;
  bossSpawned = false;

  const spawnCount = 5 + wave * 3;
  waveEnemiesLeft = spawnCount + (wave%5===0 ? 1 : 0);

  const types = wave <= 2 ? ['grunt'] :
                wave <= 4 ? ['grunt','heavy'] :
                wave <= 6 ? ['grunt','heavy','sniper'] :
                            ['grunt','heavy','sniper','flanker'];

  const spawnPoints = [
    new THREE.Vector3(-80,0,0), new THREE.Vector3(80,0,0),
    new THREE.Vector3(0,0,-80), new THREE.Vector3(0,0,80),
    new THREE.Vector3(-60,0,-60), new THREE.Vector3(60,0,-60),
    new THREE.Vector3(-60,0,60), new THREE.Vector3(60,0,60),
  ];

  for (let i=0; i<spawnCount; i++) {
    const type = types[Math.floor(Math.random()*types.length)];
    const sp = spawnPoints[Math.floor(Math.random()*spawnPoints.length)].clone();
    sp.x += (Math.random()-0.5)*15;
    sp.z += (Math.random()-0.5)*15;
    setTimeout(() => { if(gameRunning) spawnEnemy(type, sp); }, i * 400);
  }

  // Boss every 5 waves
  if (wave % 5 === 0) {
    setTimeout(() => {
      if(gameRunning) {
        const bossPos = new THREE.Vector3(0,0,60);
        spawnEnemy('boss', bossPos);
        bossSpawned = true;
        document.getElementById('boss-bar').classList.add('show');
        Sounds.bossRoar();
      }
    }, spawnCount*400 + 2000);
  }
}

// ============================================================
// WEAPON SYSTEM
// ============================================================
function getWeapon() { return Player.weapons[Player.currentWeapon]; }

function switchWeapon(idx) {
  if (idx === Player.currentWeapon || Player.reloading) return;
  Player.currentWeapon = idx;
  Player.reloading = false;
  document.getElementById('reload-bar').classList.remove('show');
  updateWeaponHUD();
  document.querySelectorAll('.wp-slot').forEach((el,i) => {
    el.classList.toggle('active', i===idx);
  });
}

function updateWeaponHUD() {
  const w = getWeapon();
  document.getElementById('weapon-name').textContent = w.name;
  document.getElementById('ammo-val').textContent = w.curAmmo;
  document.getElementById('ammo-reserve').textContent = '/ ' + w.curReserve;
  document.getElementById('low-ammo').classList.toggle('show', w.curAmmo <= Math.ceil(w.ammo*0.25) && w.curAmmo > 0);
}

function startReload() {
  const w = getWeapon();
  if (Player.reloading || w.curAmmo === w.ammo || w.curReserve === 0) return;
  Player.reloading = true;
  Player.reloadTimer = 0;
  Sounds.reload();
  const bar = document.getElementById('reload-bar');
  const fill = document.getElementById('reload-fill');
  bar.classList.add('show');
  fill.style.transition = `width ${w.reload}s linear`;
  fill.style.width = '0%';
  requestAnimationFrame(() => { fill.style.width = '100%'; });
  setTimeout(() => {
    if (!Player.alive) return;
    const needed = w.ammo - w.curAmmo;
    const take = Math.min(needed, w.curReserve);
    w.curAmmo += take; w.curReserve -= take;
    Player.reloading = false;
    bar.classList.remove('show');
    fill.style.width = '0%';
    fill.style.transition = '';
    updateWeaponHUD();
  }, w.reload * 1000);
}

function tryShoot() {
  if (!Player.alive || Player.reloading || !Player.canShoot) return;
  const w = getWeapon();
  if (w.curAmmo <= 0) { startReload(); return; }
  if (!w.auto && !mouseJustPressed) return;

  w.curAmmo--;
  Player.canShoot = false;
  Player.shootCooldown = 60000 / w.rpm;

  // Sound
  const sfxMap = {0:'rifleShot',1:'shotgunShot',2:'sniperShot',3:'plasmaShot'};
  Sounds[sfxMap[Player.currentWeapon]]();

  // Camera recoil
  Player.pitch += w.recoil * (0.5 + Math.random()*0.5);
  Player.yaw   += (Math.random()-0.5) * w.recoil * 0.5;

  // Screen shake
  addScreenShake(w.recoil * 5);

  // Muzzle flash
  const muzzlePos = camera.position.clone().add(camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(1));
  spawnMuzzleFlash(muzzlePos, w.color);

  if (w.type === 'hitscan') {
    const pellets = w.pellets || 1;
    for (let p=0; p<pellets; p++) {
      const dir = camera.getWorldDirection(new THREE.Vector3());
      dir.x += (Math.random()-0.5)*w.spread*2;
      dir.y += (Math.random()-0.5)*w.spread*2;
      dir.z += (Math.random()-0.5)*w.spread*2;
      dir.normalize();

      const ray = new THREE.Raycaster(camera.position.clone(), dir, 0.1, w.range);
      const end = camera.position.clone().add(dir.clone().multiplyScalar(w.range));

      // Check enemies
      let hit = false;
      let closestDist = Infinity;
      let closestEnemy = null;

      enemies.forEach(en => {
        if (!en.alive) return;
        const d = en.pos.distanceTo(camera.position);
        if (d < closestDist && d < w.range) {
          const toEnemy = en.pos.clone().add(new THREE.Vector3(0,1,0)).sub(camera.position);
          const angle = toEnemy.normalize().dot(dir);
          if (angle > 0.97 - (0.05*Math.min(1,10/d))) {
            closestDist = d;
            closestEnemy = en;
          }
        }
      });

      if (closestEnemy) {
        hit = true;
        const dmg = Math.floor(w.damage * (0.8+Math.random()*0.4));
        damageEnemy(closestEnemy, dmg, dir);
        const impactPos = closestEnemy.pos.clone().add(new THREE.Vector3(0,1,0));
        spawnBloodEffect(impactPos);
        showHitMarker();
        const tracerEnd = impactPos.clone();
        spawnTracer(muzzlePos, tracerEnd, w.color);
      } else {
        // Ground/wall impact
        const ray2 = new THREE.Raycaster(camera.position.clone(), dir);
        spawnBulletImpact(end, new THREE.Vector3(0,1,0));
        spawnTracer(muzzlePos, end, w.color);
      }
    }
  } else if (w.type === 'projectile') {
    const dir = camera.getWorldDirection(new THREE.Vector3());
    dir.x += (Math.random()-0.5)*w.spread;
    dir.y += (Math.random()-0.5)*w.spread;
    dir.normalize();
    spawnProjectile(camera.position.clone(), dir, w.projSpeed, w.damage, w.color, w.aoe);
  }

  updateWeaponHUD();
  // Auto-reload if empty
  if (w.curAmmo === 0 && w.curReserve > 0) setTimeout(startReload, 200);
}

// SCREEN SHAKE
// ============================================================
let shakeIntensity = 0;
const shakeOffset = new THREE.Vector3();

function addScreenShake(amount) { shakeIntensity = Math.max(shakeIntensity, amount); }

function updateShake(dt) {
  if (shakeIntensity > 0) {
    shakeOffset.set(
      (Math.random()-0.5)*shakeIntensity*0.02,
      (Math.random()-0.5)*shakeIntensity*0.02,
      0
    );
    shakeIntensity *= (1 - dt*15);
    if (shakeIntensity < 0.01) { shakeIntensity = 0; shakeOffset.set(0,0,0); }
  }
}

// ============================================================
// DAMAGE SYSTEM
// ============================================================
function damageEnemy(enemy, dmg, dir) {
  if (!enemy.alive) return;
  enemy.health -= dmg;
  enemy.hitFlashTimer = 0.1;
  enemy.alertTimer = 5;
  enemy.state = 'attack';
  if (enemy.health <= 0) killEnemy(enemy, dir);
  if (enemy.isBoss) updateBossBar(enemy);
}

function killEnemy(enemy, dir) {
  enemy.alive = false;
  enemy.dying = true;
  enemy.deathTimer = 0;
  spawnBloodEffect(enemy.pos.clone());
  spawnExplosion(enemy.pos.clone().add(new THREE.Vector3(0,1,0)), 2, enemy.def.color);

  // Kill feed
  const feed = document.getElementById('killfeed');
  const entry = document.createElement('div');
  entry.className = 'kf-entry';
  entry.textContent = `▸ ${enemy.type.toUpperCase()} ELIMINATED`;
  feed.appendChild(entry);
  setTimeout(() => entry.remove(), 3000);

  Player.kills++;
  Player.score += enemy.def.score * Player.wave;
  document.getElementById('score-val').textContent = 'SCORE: ' + Player.score.toLocaleString();

  // Remove from scene after death animation
  setTimeout(() => {
    scene.remove(enemy.mesh);
    const idx = enemies.indexOf(enemy);
    if (idx > -1) enemies.splice(idx, 1);

    // Check wave clear
    const alive = enemies.filter(e=>e.alive).length;
    if (alive === 0 && gameRunning) {
      setTimeout(() => { if(gameRunning) startWave(Player.wave + 1); }, 3000);
    }
  }, 1500);
}

function damagePlayer(dmg, attackerPos) {
  if (!Player.alive) return;

  // Shield absorbs first
  if (Player.shield > 0) {
    const absorbed = Math.min(Player.shield, dmg);
    Player.shield -= absorbed;
    dmg -= absorbed;
    Player.shieldRegenTimer = 5;
    updateShieldHUD();
  }

  if (dmg > 0) {
    Player.health = Math.max(0, Player.health - dmg);
    updateHealthHUD();
  }

  // Visual feedback
  const vig = document.getElementById('vignette');
  vig.classList.add('hit');
  setTimeout(() => vig.classList.remove('hit'), 150);
  addScreenShake(dmg * 0.3);
  Sounds.hit();

  if (Player.health <= 0) die();
  else if (Player.health < 25) vig.classList.add('low');
  else vig.classList.remove('low');
}

function die() {
  if (!Player.alive) return;
  Player.alive = false;
  Sounds.death();
  document.getElementById('vignette').classList.add('hit');
  flashScreen(0.5);
  addScreenShake(20);
  Player.respawnTimer = 5;
  setTimeout(showDeathScreen, 2000);
}

function showDeathScreen() {
  const ov = document.getElementById('overlay');
  document.getElementById('overlay-title').textContent = 'KILLED IN ACTION';
  document.getElementById('overlay-sub').textContent = 'YOU HAVE FALLEN';
  document.getElementById('overlay-stats').textContent = `WAVE ${Player.wave} · KILLS ${Player.kills} · SCORE ${Player.score.toLocaleString()}`;
  document.getElementById('overlay-btn').textContent = '▶ REDEPLOY';
  ov.classList.add('show');
  document.exitPointerLock();
}

function respawnPlayer() {
  Player.health = Player.maxHealth;
  Player.shield = Player.maxShield;
  Player.alive = true;
  Player.pos.set(0, 1.7, 0);
  Player.yVel = 0;
  Player.reloading = false;
  document.getElementById('vignette').classList.remove('hit','low');
  updateHealthHUD(); updateShieldHUD(); updateWeaponHUD();
}

function updateHealthHUD() {
  const pct = (Player.health/Player.maxHealth)*100;
  document.getElementById('health-bar').style.width = pct+'%';
  document.getElementById('health-val').textContent = Math.max(0,Math.ceil(Player.health));
  const col = pct > 50 ? '#00ffc8' : pct > 25 ? '#ffcc00' : '#ff2200';
  document.getElementById('health-bar').style.background = `linear-gradient(90deg,${col},${col}99)`;
  document.getElementById('health-bar').style.boxShadow = `0 0 8px ${col}`;
  document.getElementById('health-val').style.color = col;
}
function updateShieldHUD() {
  const pct = (Player.shield/Player.maxShield)*100;
  document.getElementById('shield-bar').style.width = pct+'%';
}
function updateBossBar(boss) {
  const pct = Math.max(0,(boss.health/boss.maxHealth)*100);
  document.getElementById('boss-bar-fill').style.width = pct+'%';
  if (pct === 0) document.getElementById('boss-bar').classList.remove('show');
}

function showHitMarker() {
  const hm = document.getElementById('hitmarker');
  hm.classList.remove('show');
  requestAnimationFrame(() => hm.classList.add('show'));
  setTimeout(() => hm.classList.remove('show'), 200);
}

function flashScreen(dur=0.1) {
  const f = document.getElementById('flash');
  f.style.opacity = '0.6';
  setTimeout(() => { f.style.opacity = '0'; }, dur*1000);
}

function toggleSlowMo() {
  if (Player.slowMoTimer <= 0 || slowMoActive) return;
  slowMoActive = true;
  slowMoTimer = 5;
}

let slowMoActive = false, slowMoTimer = 0;

// ============================================================
// ENEMY AI
// ============================================================
function updateEnemy(enemy, dt, playerPos) {
  if (!enemy.alive) {
    if (enemy.dying) {
      enemy.deathTimer += dt;
      enemy.mesh.position.y -= dt * 2;
      enemy.mesh.rotation.z += dt * 3;
      enemy.mesh.scale.multiplyScalar(1 - dt*0.5);
    }
    return;
  }

  const distToPlayer = enemy.pos.distanceTo(playerPos);
  enemy.bobTimer += dt * 3;

  // Hit flash
  if (enemy.hitFlashTimer > 0) {
    enemy.hitFlashTimer -= dt;
    enemy.body.material.emissive.setHex(0xffffff);
    enemy.body.material.emissiveIntensity = 5;
  } else {
    enemy.body.material.emissive.setHex(enemy.def.color);
    enemy.body.material.emissiveIntensity = 0.3;
  }

  // Alert / state machine
  const detectionRange = enemy.type === 'sniper' ? 70 : 35;
  const canSeePlayer = distToPlayer < detectionRange;

  if (canSeePlayer) {
    enemy.alertTimer = 5;
    enemy.state = distToPlayer < 5 ? 'melee' : 'attack';
    enemy.lastSeenPlayer = playerPos.clone();
  } else if (enemy.alertTimer > 0) {
    enemy.alertTimer -= dt;
    enemy.state = 'chase';
  } else {
    enemy.state = 'patrol';
  }

  const speed = slowMoActive ? enemy.def.speed * 0.3 : enemy.def.speed;

  switch(enemy.state) {
    case 'patrol':
      if (!enemy.patrolTarget || enemy.pos.distanceTo(enemy.patrolTarget) < 2 || (enemy.patrolTimer-=dt)<=0) {
        enemy.patrolTarget = new THREE.Vector3((Math.random()-0.5)*120, 0, (Math.random()-0.5)*120);
        enemy.patrolTimer = 5 + Math.random()*5;
      }
      moveEnemyToward(enemy, enemy.patrolTarget, speed*0.5, dt);
      break;

    case 'chase':
      if (enemy.lastSeenPlayer) moveEnemyToward(enemy, enemy.lastSeenPlayer, speed, dt);
      break;

    case 'attack':
      // Flanking behavior
      enemy.flankTimer -= dt;
      if (enemy.type === 'flanker' && enemy.flankTimer <= 0) {
        const flankAngle = Math.random()*Math.PI*2;
        const flankDist = 10 + Math.random()*10;
        const flankPos = playerPos.clone().add(new THREE.Vector3(Math.cos(flankAngle)*flankDist, 0, Math.sin(flankAngle)*flankDist));
        enemy.patrolTarget = flankPos;
        enemy.flankTimer = 2 + Math.random()*2;
      }

      // Optimal range
      const optRange = enemy.type === 'sniper' ? 50 : enemy.type === 'heavy' ? 12 : 18;
      if (distToPlayer > optRange + 3) {
        moveEnemyToward(enemy, playerPos, speed, dt);
      } else if (distToPlayer < optRange - 3) {
        const awayDir = enemy.pos.clone().sub(playerPos).normalize();
        const awayTarget = enemy.pos.clone().add(awayDir.multiplyScalar(5));
        moveEnemyToward(enemy, awayTarget, speed*0.7, dt);
      } else {
        // Strafe
        const strafeDir = new THREE.Vector3(-Math.sin(enemy.bobTimer), 0, Math.cos(enemy.bobTimer));
        enemy.pos.add(strafeDir.multiplyScalar(speed*0.4*dt));
      }

      // Shoot
      enemy.shootTimer -= dt * (slowMoActive ? 0.2 : 1);
      if (enemy.shootTimer <= 0 && distToPlayer < enemy.def.range && Player.alive) {
        enemy.shootTimer = 60 / enemy.def.rpm;
        enemyShoot(enemy, playerPos);
      }
      break;

    case 'melee':
      moveEnemyToward(enemy, playerPos, speed*1.5, dt);
      enemy.shootTimer -= dt;
      if (enemy.shootTimer <= 0 && distToPlayer < 3 && Player.alive) {
        enemy.shootTimer = 0.5;
        damagePlayer(enemy.damage * 1.5, enemy.pos);
      }
      break;
  }

  // Keep on ground
  enemy.pos.y = 0;
  enemy.mesh.position.copy(enemy.pos);

  // Face player/movement
  if (enemy.lastSeenPlayer || enemy.state !== 'patrol') {
    const target = enemy.lastSeenPlayer || playerPos;
    const angle = Math.atan2(target.x - enemy.pos.x, target.z - enemy.pos.z);
    enemy.mesh.rotation.y = angle + Math.sin(enemy.bobTimer*2)*0.02;
  }

  // Bob animation
  enemy.mesh.position.y = Math.sin(enemy.bobTimer)*0.05;
}

function moveEnemyToward(enemy, target, speed, dt) {
  const dir = target.clone().sub(enemy.pos);
  dir.y = 0;
  const dist = dir.length();
  if (dist < 0.5) return;
  dir.normalize();
  enemy.pos.add(dir.multiplyScalar(speed * dt));
  // Boundary
  enemy.pos.x = Math.max(-95, Math.min(95, enemy.pos.x));
  enemy.pos.z = Math.max(-95, Math.min(95, enemy.pos.z));
}

function enemyShoot(enemy, playerPos) {
  if (!Player.alive) return;
  const dir = playerPos.clone().add(new THREE.Vector3(0,1.5,0)).sub(enemy.pos.clone().add(new THREE.Vector3(0,1,0)));
  const dist = dir.length();
  dir.normalize();

  // Accuracy degrades with distance
  const spread = 0.05 + (dist / enemy.def.range) * 0.1;
  dir.x += (Math.random()-0.5)*spread;
  dir.z += (Math.random()-0.5)*spread;

  // Check if hits player (simplified)
  const hitChance = Math.max(0.1, 1 - dist/enemy.def.range);
  if (Math.random() < hitChance * 0.4) {
    damagePlayer(enemy.damage, enemy.pos);
  }

  // Visual shoot effect from enemy
  spawnTracer(
    enemy.pos.clone().add(new THREE.Vector3(0,1,0)),
    playerPos.clone().add(new THREE.Vector3(0,1.5,0)),
    enemy.def.color
  );
  // Enemy muzzle flash
  const fl = new THREE.PointLight(enemy.def.color, 5, 4);
  fl.position.copy(enemy.pos).add(new THREE.Vector3(0,1,0));
  scene.add(fl);
  setTimeout(()=>scene.remove(fl),60);
}

// ============================================================
// PICKUP SYSTEM
// ============================================================
function updatePickups(dt, playerPos) {
  pickups.forEach(p => {
    if (p.cooldown > 0) { p.cooldown -= dt; p.mesh.visible = p.cooldown < 0; return; }
    p.icon.rotation.y += dt * 2;
    p.icon.position.y = p.pos.y + 0.5 + Math.sin(Date.now()*0.002)*0.15;

    if (playerPos.distanceTo(p.pos) < 2.5) {
      let msg = '';
      switch(p.type) {
        case 'health': if(Player.health<Player.maxHealth){Player.health=Math.min(Player.maxHealth,Player.health+40);updateHealthHUD();msg='HEALTH +40';} break;
        case 'ammo':   Player.weapons.forEach(w=>{w.curReserve=Math.min(w.reserve*2,w.curReserve+w.reserve)});updateWeaponHUD();msg='AMMO RESUPPLY'; break;
        case 'shield': Player.shield=Player.maxShield;updateShieldHUD();msg='SHIELD RESTORED'; break;
        case 'slowmo': Player.slowMoTimer=Math.min(Player.slowMoMax,Player.slowMoTimer+100);msg='SLOW-MO CHARGED'; break;
      }
      if(msg){Sounds.pickup();showPickupNotif(msg);p.cooldown=20;}
    }
  });
}

function showPickupNotif(msg) {
  const el = document.getElementById('pickup-notif');
  el.textContent = '⬡ ' + msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ============================================================
// PLAYER MOVEMENT
// ============================================================
const GRAVITY = 20;
const JUMP_FORCE = 8;
let footstepTimer = 0;

function updatePlayer(dt) {
  if (!Player.alive) return;

  // Sprint / crouch
  Player.sprinting = Keys['ShiftLeft'] && !Player.crouching && !Player.ads;
  Player.crouching = Keys['ControlLeft'] || Keys['KeyC'];
  Player.ads = Mouse.right;

  // Target camera height
  const targetHeight = Player.crouching ? 1.0 : 1.7;
  camera.position.y += (targetHeight - camera.position.y) * dt * 12;

  // ADS crosshair
  document.getElementById('crosshair').classList.toggle('ads', Player.ads);

  // Move direction
  const forward = new THREE.Vector3(-Math.sin(Player.yaw), 0, -Math.cos(Player.yaw));
  const right   = new THREE.Vector3( Math.cos(Player.yaw), 0, -Math.sin(Player.yaw));
  const move = new THREE.Vector3();
  if (Keys['KeyW'] || Keys['ArrowUp'])    move.add(forward);
  if (Keys['KeyS'] || Keys['ArrowDown'])  move.sub(forward);
  if (Keys['KeyA'] || Keys['ArrowLeft'])  move.sub(right);
  if (Keys['KeyD'] || Keys['ArrowRight']) move.add(right);

  Player.isMoving = move.length() > 0.1;

  if (Player.isMoving) {
    move.normalize();
    let spd = Player.speed;
    if (Player.sprinting) spd *= Player.sprintMult;
    if (Player.crouching) spd *= Player.crouchMult;
    if (slowMoActive) spd *= 0.5;
    Player.pos.add(move.multiplyScalar(spd * dt));

    // Footstep audio
    footstepTimer -= dt;
    if (footstepTimer <= 0) {
      footstepTimer = Player.sprinting ? 0.25 : 0.4;
      Sounds.footstep();
    }
  }

  // Boundary
  Player.pos.x = Math.max(-95, Math.min(95, Player.pos.x));
  Player.pos.z = Math.max(-95, Math.min(95, Player.pos.z));

  // Gravity + Jump
  if (!Player.onGround) {
    Player.yVel -= GRAVITY * dt;
  }
  Player.pos.y += Player.yVel * dt;
  if (Player.pos.y <= 0) {
    Player.pos.y = 0;
    Player.yVel = 0;
    Player.onGround = true;
    Player.jumping = false;
  }

  // Weapon bob
  if (Player.isMoving && Player.onGround) {
    Player.bobTimer += dt * (Player.sprinting ? 12 : 7);
    const bobAmt = Player.sprinting ? 0.04 : 0.02;
    camera.position.y += Math.sin(Player.bobTimer) * bobAmt;
  }

  // FOV for sprint
  const targetFOV = Player.ads ? 40 : Player.sprinting ? 85 : 75;
  camera.fov += (targetFOV - camera.fov) * dt * 8;
  camera.updateProjectionMatrix();

  // Apply position and rotation
  camera.position.x = Player.pos.x + shakeOffset.x;
  camera.position.z = Player.pos.z + shakeOffset.z;
  camera.rotation.order = 'YXZ';
  camera.rotation.y = Player.yaw;
  camera.rotation.x = Player.pitch + shakeOffset.y * 0.5;

  // Shield regeneration
  if (Player.shield < Player.maxShield) {
    Player.shieldRegenTimer -= dt;
    if (Player.shieldRegenTimer <= 0) {
      Player.shield = Math.min(Player.maxShield, Player.shield + 15*dt);
      updateShieldHUD();
      if (Player.shield >= Player.maxShield) Sounds.shieldRegen();
    }
  }

  // Slow-mo
  if (slowMoActive) {
    slowMoTimer -= dt * 60;
    if (slowMoTimer <= 0) { slowMoActive = false; slowMoTimer = 0; }
  }
}

function tryJump() {
  if (Player.onGround && Player.alive) {
    Player.yVel = JUMP_FORCE;
    Player.onGround = false;
    Player.jumping = true;
  }
}

// ============================================================
// PROJECTILE UPDATE
// ============================================================
function updateProjectiles(dt) {
  for (let i = projectiles.length-1; i>=0; i--) {
    const p = projectiles[i];
    if (!p.alive) { projectiles.splice(i,1); continue; }

    const step = p.dir.clone().multiplyScalar(p.speed * dt * (slowMoActive?0.2:1));
    p.mesh.position.add(step);
    p.light.position.copy(p.mesh.position);
    p.dist += step.length();

    // Check enemy hit
    let hit = false;
    enemies.forEach(en => {
      if (!en.alive || hit) return;
      if (en.pos.distanceTo(p.mesh.position) < 1.5 * (en.type==='boss'?2.5:1)) {
        damageEnemy(en, p.damage, p.dir);
        hit = true;
        showHitMarker();
        spawnExplosion(p.mesh.position.clone(), p.aoe, 0xff00ff);
        // AOE damage
        enemies.forEach(en2 => {
          if (!en2.alive || en2===en) return;
          if (en2.pos.distanceTo(p.mesh.position) < p.aoe) {
            damageEnemy(en2, p.damage*0.5, p.dir);
          }
        });
      }
    });

    // Check player area (avoid self)
    if (!hit && p.dist > 150) hit = true;
    if (!hit && p.mesh.position.y < -1) hit = true;

    if (hit) {
      p.alive = false;
      scene.remove(p.mesh); scene.remove(p.light);
    }
  }
}

// ============================================================
// PARTICLE UPDATE
// ============================================================
function updateParticles(dt) {
  for (let i = particleSystems.length-1; i>=0; i--) {
    const ps = particleSystems[i];
    if (ps.type === 'ambient') {
      ps.mesh.rotation.y += dt * 0.01;
      continue;
    }
    ps.timer += dt;
    const progress = ps.maxTime ? ps.timer/ps.maxTime : 0;

    if (ps.type === 'explosion' || ps.type === 'sparks' || ps.type === 'blood') {
      const pos = ps.mesh.geometry.attributes.position;
      for (let j=0; j<ps.velocities.length; j++) {
        ps.velocities[j].y -= GRAVITY * dt * 0.5;
        pos.array[j*3]   += ps.velocities[j].x * dt;
        pos.array[j*3+1] += ps.velocities[j].y * dt;
        pos.array[j*3+2] += ps.velocities[j].z * dt;
      }
      pos.needsUpdate = true;
      ps.mesh.material.opacity = Math.max(0, 1-progress);
      if (ps.light) { ps.light.intensity = Math.max(0, 10*(1-progress)); }
      if (ps.timer >= ps.maxTime) {
        scene.remove(ps.mesh);
        if (ps.light) scene.remove(ps.light);
        particleSystems.splice(i,1);
      }
    } else if (ps.type === 'tracer') {
      ps.mesh.material.opacity = Math.max(0, 1 - ps.timer/ps.maxTime);
      if (ps.timer >= ps.maxTime) { scene.remove(ps.mesh); particleSystems.splice(i,1); }
    }
  }
}

// ============================================================
// MINIMAP
// ============================================================
function updateMinimap() {
  mmCtx.clearRect(0,0,150,150);
  mmCtx.fillStyle = 'rgba(0,10,20,0.9)';
  mmCtx.fillRect(0,0,150,150);

  const scale = 150/200;
  const cx=75, cy=75;

  // Cover objects
  mmCtx.fillStyle = 'rgba(50,80,120,0.5)';
  coverObjects.forEach(c => {
    const mx = cx + c.pos.x*scale;
    const my = cy + c.pos.z*scale;
    mmCtx.fillRect(mx-2, my-2, 4, 4);
  });

  // Enemies
  enemies.forEach(en => {
    if (!en.alive) return;
    mmCtx.fillStyle = en.isBoss ? '#ff0000' : '#ff4400';
    const mx = cx + en.pos.x*scale;
    const my = cy + en.pos.z*scale;
    mmCtx.beginPath();
    mmCtx.arc(mx,my, en.isBoss?4:2, 0, Math.PI*2);
    mmCtx.fill();
  });

  // Player
  mmCtx.fillStyle = '#00ffc8';
  mmCtx.beginPath();
  mmCtx.arc(cx+Player.pos.x*scale, cy+Player.pos.z*scale, 3, 0, Math.PI*2);
  mmCtx.fill();

  // Player direction
  mmCtx.strokeStyle = '#00ffc8';
  mmCtx.lineWidth = 1.5;
  mmCtx.beginPath();
  mmCtx.moveTo(cx+Player.pos.x*scale, cy+Player.pos.z*scale);
  mmCtx.lineTo(cx+Player.pos.x*scale - Math.sin(Player.yaw)*8, cy+Player.pos.z*scale - Math.cos(Player.yaw)*8);
  mmCtx.stroke();

  // Border
  mmCtx.strokeStyle = 'rgba(0,255,200,0.3)';
  mmCtx.lineWidth = 1;
  mmCtx.strokeRect(0,0,150,150);
}

// ============================================================
// GAME LOOP
// ============================================================
let gameRunning = false;
let lastTime = 0;
let mouseJustPressed = false;
let prevMouseDown = false;

function startGame() {
  document.getElementById('overlay').classList.remove('show');
  canvas.requestPointerLock();
  if (!gameRunning) {
    gameRunning = true;
    // Reset
    enemies.length = 0; projectiles.length = 0;
    Player.health = 100; Player.shield = 100;
    Player.score = 0; Player.kills = 0; Player.wave = 0;
    Player.pos.set(0,0,0); Player.yaw=0; Player.pitch=0;
    Player.alive = true;
    Player.weapons.forEach(w => { w.curAmmo=w.ammo; w.curReserve=w.reserve; });
    slowMoActive = false; slowMoTimer = 0;
    updateHealthHUD(); updateShieldHUD(); updateWeaponHUD();
    document.getElementById('vignette').classList.remove('hit','low');
    document.getElementById('boss-bar').classList.remove('show');
    startWave(1);
    requestAnimationFrame(gameLoop);
  } else {
    // Respawn
    respawnPlayer();
    document.getElementById('overlay').classList.remove('show');
  }
}

function gameLoop(timestamp) {
  if (!gameRunning) return;
  requestAnimationFrame(gameLoop);

  let dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  if (slowMoActive) dt *= 0.25;

  // Mouse state
  mouseJustPressed = Mouse.down && !prevMouseDown;
  prevMouseDown = Mouse.down;

  // Shoot
  if (Player.alive && pointerLocked) {
    Player.shootCooldown -= (timestamp - lastTime + dt*1000);
    if (Player.canShoot === false) {
      Player.shootCooldown = Math.max(0, Player.shootCooldown);
      if (Player.shootCooldown <= 0) Player.canShoot = true;
    }
    const w = getWeapon();
    const shouldShoot = w.auto ? Mouse.down : mouseJustPressed;
    if (shouldShoot && Player.canShoot && !Player.reloading) tryShoot();
  }

  updatePlayer(dt);
  updateShake(dt);

  // Update enemies
  const playerPos = Player.pos.clone().add(new THREE.Vector3(0,1.5,0));
  enemies.forEach(en => updateEnemy(en, dt, Player.pos));

  // Update projectiles
  updateProjectiles(dt);

  // Update particles
  updateParticles(dt);

  // Update pickups
  updatePickups(dt, Player.pos);

  // Minimap
  updateMinimap();

  // Ambient particles float
  particleSystems.forEach(ps => {
    if (ps.type === 'ambient') {
      const pos = ps.mesh.geometry.attributes.position;
      for (let i=0; i<pos.count; i++) {
        pos.array[i*3+1] += 0.005;
        if (pos.array[i*3+1] > 45) pos.array[i*3+1] = 0;
      }
      pos.needsUpdate = true;
    }
  });

  // Apply camera position from Player
  camera.position.x = Player.pos.x + shakeOffset.x;
  camera.position.y = (Player.crouching ? 1.0 : 1.7) + Player.pos.y;
  camera.position.z = Player.pos.z + shakeOffset.z;

  renderer.render(scene, camera);
}

// ============================================================
// RESIZE
// ============================================================
window.addEventListener('resize', () => {
  renderer.setSize(W(), H());
  camera.aspect = W()/H();
  camera.updateProjectionMatrix();
});

// ============================================================
// INIT
// ============================================================
setupLighting();
buildMap();

// Show start overlay
const ov = document.getElementById('overlay');
document.getElementById('overlay-title').textContent = 'NEXUS STRIKE';
document.getElementById('overlay-sub').textContent = 'FUTURISTIC COMBAT ARENA — WAVE SURVIVAL';
document.getElementById('overlay-stats').textContent = 'WASD · MOUSE · SHIFT SPRINT · C CROUCH · R RELOAD · F SLOW-MO · 1-4 WEAPONS';
document.getElementById('overlay-btn').textContent = '▶ DEPLOY';
ov.classList.add('show');

// Render a static frame so map is visible
renderer.render(scene, camera);
</script>
</body>
</html>

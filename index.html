<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fighter Game</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@10/dist/framer-motion.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; overflow: hidden; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        const { useState, useEffect, useRef } = React;
        
        function FighterGame() {
            const [p1, setP1] = useState({ 
                hp: 100, 
                maxHp: 100,
                x: 100, 
                power: 0, 
                transformed: false, 
                jump: false, 
                block: false,
                attacking: false,
                knockback: 0,
                stunned: 0
            });
            
            const [p2, setP2] = useState({ 
                hp: 100, 
                maxHp: 100,
                x: 650, 
                transformed: false,
                attacking: false,
                knockback: 0,
                stunned: 0,
                actionCooldown: 0
            });
            
            const [msg, setMsg] = useState('ROUND 1 - FIGHT!');
            const [combo, setCombo] = useState([]);
            const [maxCombo, setMaxCombo] = useState(0);
            const [round, setRound] = useState(1);
            const [gameState, setGameState] = useState('playing');
            const [effects, setEffects] = useState([]);
            const effectIdRef = useRef(0);
            const keysPressed = useRef({});

            // Handle key down
            useEffect(() => {
                const down = (e) => {
                    keysPressed.current[e.key.toLowerCase()] = true;
                    if (gameState !== 'playing') return;

                    if (e.key.toLowerCase() === 'a') setP1(v => ({ ...v, x: Math.max(0, v.x - 25) }));
                    if (e.key.toLowerCase() === 'd') setP1(v => ({ ...v, x: Math.min(700, v.x + 25) }));
                    if (e.key.toLowerCase() === 'w') jump();
                    if (e.key.toLowerCase() === 'l') setP1(v => ({ ...v, block: true }));
                    if (e.key.toLowerCase() === 'j') attack('J', 10);
                    if (e.key.toLowerCase() === 'k') attack('K', 18);
                    if (e.key.toLowerCase() === 'f') fireball();
                    if (e.key.toLowerCase() === 't' && p1.power >= 100) transform();
                };

                const up = (e) => { 
                    keysPressed.current[e.key.toLowerCase()] = false;
                    if (e.key.toLowerCase() === 'l') setP1(v => ({ ...v, block: false })); 
                };

                window.addEventListener('keydown', down);
                window.addEventListener('keyup', up);
                return () => {
                    window.removeEventListener('keydown', down);
                    window.removeEventListener('keyup', up);
                };
            }, [p1, combo, gameState]);

            // Continuous movement
            useEffect(() => {
                const moveInterval = setInterval(() => {
                    if (keysPressed.current['a']) {
                        setP1(v => ({ ...v, x: Math.max(0, v.x - 15) }));
                    }
                    if (keysPressed.current['d']) {
                        setP1(v => ({ ...v, x: Math.min(700, v.x + 15) }));
                    }
                }, 50);

                return () => clearInterval(moveInterval);
            }, []);

            // AI Logic
            useEffect(() => {
                if (gameState !== 'playing') return;

                const ai = setInterval(() => {
                    setP2(v => {
                        if (v.stunned > 0) return { ...v, stunned: v.stunned - 1 };
                        if (v.actionCooldown > 0) return { ...v, actionCooldown: v.actionCooldown - 1 };

                        const distance = Math.abs(v.x - p1.x);
                        const newX = distance > 120 ? (v.x > p1.x ? v.x - 18 : v.x + 18) : v.x;

                        const random = Math.random();
                        if (distance < 90 && random > 0.7) {
                            const damage = random > 0.85 ? 18 : 10;
                            setP1(prev => {
                                const actualDamage = prev.block ? Math.ceil(damage * 0.3) : damage;
                                return { ...prev, hp: Math.max(0, prev.hp - actualDamage), stunned: 2 };
                            });
                            return { ...v, actionCooldown: 8, attacking: true };
                        } else if (v.hp < 40 && random > 0.6 && v.power >= 25) {
                            setP1(prev => ({ ...prev, hp: Math.max(0, prev.hp - 20) }));
                            return { ...v, actionCooldown: 10, power: v.power - 25 };
                        }

                        return { ...v, x: Math.max(0, Math.min(700, newX)), attacking: false };
                    });
                }, 600);

                return () => clearInterval(ai);
            }, [p1, gameState]);

            // Game state check
            useEffect(() => {
                if (p1.hp <= 0) {
                    setGameState('p2-win');
                    setMsg('GAME OVER - YOU LOSE!');
                } else if (p2.hp <= 0) {
                    setGameState('p1-win');
                    setMsg('VICTORY!');
                }
            }, [p1.hp, p2.hp]);

            const addEffect = (x, y, text, color = 'text-yellow-300') => {
                const id = effectIdRef.current++;
                setEffects(prev => [...prev, { id, x, y, text, color }]);
                setTimeout(() => {
                    setEffects(prev => prev.filter(e => e.id !== id));
                }, 1500);
            };

            const jump = () => {
                if (p1.jump || p1.stunned > 0) return;
                setP1(v => ({ ...v, jump: true }));
                setTimeout(() => setP1(v => ({ ...v, jump: false })), 500);
            };

            const attack = (key, dmg) => {
                if (p1.attacking || p1.stunned > 0 || gameState !== 'playing') return;

                const newCombo = [...combo, key].slice(-3);
                setCombo(newCombo);

                let bonus = 0;
                if (newCombo.join('') === 'JJK') bonus = 20;
                if (newCombo.join('') === 'KKJ') bonus = 15;

                if (combo.length > 0 && combo[combo.length - 1] === key) {
                    setCombo([key]);
                } else {
                    setCombo(newCombo);
                }

                setP1(v => ({ ...v, attacking: true }));
                setTimeout(() => setP1(v => ({ ...v, attacking: false })), 300);

                if (Math.abs(p1.x - p2.x) < 90) {
                    const totalDmg = dmg + bonus;
                    setP2(v => ({ 
                        ...v, 
                        hp: Math.max(0, v.hp - totalDmg),
                        knockback: 30,
                        stunned: bonus > 0 ? 3 : 1
                    }));
                    setP1(v => ({ ...v, power: Math.min(100, v.power + 15) }));
                    addEffect(p2.x + 50, 150, totalDmg.toString(), bonus ? 'text-red-400' : 'text-yellow-300');
                    
                    if (bonus) {
                        setMsg(`COMBO x${newCombo.length}!`);
                        if (newCombo.length > maxCombo) setMaxCombo(newCombo.length);
                    }
                }
            };

            const fireball = () => {
                if (p1.power < 40 || p1.attacking || gameState !== 'playing') return;

                setP1(v => ({ ...v, power: v.power - 40, attacking: true }));
                setTimeout(() => setP1(v => ({ ...v, attacking: false })), 400);

                setP2(v => ({ 
                    ...v, 
                    hp: Math.max(0, v.hp - 25),
                    knockback: 60,
                    stunned: 4
                }));
                
                addEffect(p2.x, 100, 'FIREBALL!', 'text-orange-400');
                setMsg('🔥 FIREBALL! 🔥');
            };

            const transform = () => {
                if (p1.power < 100 || p1.transformed || gameState !== 'playing') return;
                
                setP1(v => ({ ...v, transformed: true, power: 0 }));
                setMsg('⚡ ULTIMATE FORM! ⚡');
                addEffect(p1.x + 50, 200, 'TRANSFORMATION', 'text-purple-400');

                setTimeout(() => {
                    setP1(v => ({ ...v, transformed: false }));
                }, 8000);
            };

            const resetRound = () => {
                setP1({ 
                    hp: 100, 
                    maxHp: 100,
                    x: 100, 
                    power: 0, 
                    transformed: false, 
                    jump: false, 
                    block: false,
                    attacking: false,
                    knockback: 0,
                    stunned: 0
                });
                setP2({ 
                    hp: 100, 
                    maxHp: 100,
                    x: 650, 
                    transformed: false,
                    attacking: false,
                    knockback: 0,
                    stunned: 0,
                    actionCooldown: 0
                });
                setCombo([]);
                setRound(round + 1);
                setGameState('playing');
                setMsg(`ROUND ${round + 1} - FIGHT!`);
            };

            const hpPercent1 = (p1.hp / p1.maxHp) * 100;
            const hpPercent2 = (p2.hp / p2.maxHp) * 100;

            return React.createElement('div', { className: 'min-h-screen bg-gradient-to-b from-slate-950 via-black to-slate-950 text-white' },
                // Header
                React.createElement('div', { className: 'flex justify-between items-center p-4 border-b-2 border-red-600' },
                    React.createElement('div', { className: 'text-center flex-1' },
                        React.createElement('div', { className: 'text-sm text-gray-400' }, `ROUND ${round}`),
                        React.createElement('div', { className: 'text-2xl font-bold text-cyan-400' }, msg)
                    )
                ),

                // HUD Stats
                React.createElement('div', { className: 'flex justify-between items-center p-4 gap-4' },
                    // P1 Stats
                    React.createElement('div', { className: 'flex-1' },
                        React.createElement('div', { className: 'text-xl font-bold mb-2' }, 'PLAYER 1'),
                        React.createElement('div', { className: 'bg-gray-800 rounded-lg p-2 mb-2' },
                            React.createElement('div', { className: 'flex justify-between text-sm mb-1' },
                                React.createElement('span', null, 'HP'),
                                React.createElement('span', null, `${p1.hp}/${p1.maxHp}`)
                            ),
                            React.createElement('div', { className: 'w-full bg-gray-900 rounded h-6 overflow-hidden' },
                                React.createElement('div', { 
                                    style: { width: `${Math.max(0, hpPercent1)}%`, transition: 'width 0.3s' },
                                    className: `h-full ${hpPercent1 > 50 ? 'bg-gradient-to-r from-green-500 to-green-400' : hpPercent1 > 25 ? 'bg-gradient-to-r from-yellow-500 to-yellow-400' : 'bg-gradient-to-r from-red-600 to-red-500'}`
                                })
                            )
                        ),
                        React.createElement('div', { className: 'bg-gray-800 rounded-lg p-2' },
                            React.createElement('div', { className: 'flex justify-between text-sm mb-1' },
                                React.createElement('span', null, '⚡ POWER'),
                                React.createElement('span', null, `${p1.power}/100`)
                            ),
                            React.createElement('div', { className: 'w-full bg-gray-900 rounded h-4 overflow-hidden' },
                                React.createElement('div', { 
                                    style: { width: `${p1.power}%`, transition: 'width 0.2s' },
                                    className: 'h-full bg-gradient-to-r from-yellow-400 to-yellow-300'
                                })
                            )
                        )
                    ),

                    // Center - Combo
                    React.createElement('div', { className: 'text-center min-w-[150px]' },
                        combo.length > 0 && React.createElement('div', { className: 'text-4xl font-bold text-yellow-300 mb-2' }, combo.join('')),
                        React.createElement('div', { className: 'text-sm text-gray-400' }, `Max Combo: ${maxCombo}`)
                    ),

                    // P2 Stats
                    React.createElement('div', { className: 'flex-1 text-right' },
                        React.createElement('div', { className: 'text-xl font-bold mb-2' }, 'ENEMY'),
                        React.createElement('div', { className: 'bg-gray-800 rounded-lg p-2 mb-2' },
                            React.createElement('div', { className: 'flex justify-between text-sm mb-1' },
                                React.createElement('span', null, `${p2.hp}/${p2.maxHp}`),
                                React.createElement('span', null, 'HP')
                            ),
                            React.createElement('div', { className: 'w-full bg-gray-900 rounded h-6 overflow-hidden' },
                                React.createElement('div', { 
                                    style: { width: `${Math.max(0, hpPercent2)}%`, transition: 'width 0.3s', marginLeft: 'auto' },
                                    className: `h-full ${hpPercent2 > 50 ? 'bg-gradient-to-l from-red-500 to-red-400' : hpPercent2 > 25 ? 'bg-gradient-to-l from-orange-500 to-orange-400' : 'bg-gradient-to-l from-red-700 to-red-600'}`
                                })
                            )
                        )
                    )
                ),

                // Game Arena
                React.createElement('div', { className: 'relative h-[500px] bg-gradient-to-b from-red-950 via-black to-black overflow-hidden border-4 border-red-800' },
                    // Background
                    React.createElement('div', { className: 'absolute inset-0 opacity-10' }),

                    // Floating effects
                    effects.map(effect => 
                        React.createElement('div', { 
                            key: effect.id,
                            style: { 
                                left: `${effect.x}px`,
                                top: `${effect.y}px`,
                                animation: 'float-up 1.5s ease-out forwards',
                                opacity: 0.8
                            },
                            className: `absolute font-bold text-2xl pointer-events-none ${effect.color}`
                        }, effect.text)
                    ),

                    // Player 1
                    React.createElement('div', { 
                        style: { 
                            transform: `translateX(${p1.x + p1.knockback}px) translateY(${p1.jump ? -150 : 0}px) scale(${p1.transformed ? 1.5 : 1})`,
                            transition: 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)'
                        },
                        className: 'absolute bottom-10'
                    },
                        React.createElement('div', { className: `w-24 h-40 bg-gradient-to-b from-blue-500 to-blue-700 rounded-2xl border-4 ${p1.transformed ? 'border-yellow-300 shadow-2xl shadow-yellow-400' : 'border-white'} flex flex-col items-center justify-start shadow-2xl` },
                            React.createElement('div', { className: `w-16 h-16 ${p1.transformed ? 'bg-yellow-300 shadow-lg shadow-yellow-300' : 'bg-yellow-200'} rounded-full mt-2` }),
                            React.createElement('div', { className: 'w-20 h-20 bg-blue-900 rounded-xl mt-2' })
                        ),
                        p1.block && React.createElement('div', { 
                            style: { 
                                animation: 'spin 1s linear infinite',
                                position: 'absolute',
                                inset: 0,
                                borderRadius: '1rem',
                                border: '4px solid #06B6D4'
                            }
                        })
                    ),

                    // Player 2 (Enemy)
                    React.createElement('div', { 
                        style: { 
                            transform: `translateX(${p2.x + p2.knockback}px) scale(${p2.transformed ? 1.2 : 1})`,
                            transition: 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)'
                        },
                        className: 'absolute bottom-10'
                    },
                        React.createElement('div', { className: `w-24 h-40 bg-gradient-to-b from-red-600 to-red-800 rounded-2xl border-4 border-white flex flex-col items-center justify-start shadow-2xl` },
                            React.createElement('div', { className: 'w-16 h-16 bg-orange-200 rounded-full mt-2' }),
                            React.createElement('div', { className: 'w-20 h-20 bg-red-900 rounded-xl mt-2' })
                        ),
                        p2.attacking && React.createElement('div', { 
                            style: { 
                                animation: 'shake 0.3s infinite',
                                marginLeft: '10px'
                            },
                            className: 'text-3xl'
                        }, '⚔️')
                    )
                ),

                // Controls and Info
                React.createElement('div', { className: 'bg-gray-900 border-t-2 border-red-600 p-4' },
                    React.createElement('div', { className: 'text-center mb-2' },
                        React.createElement('h3', { className: 'text-lg font-bold text-cyan-400 mb-2' }, 'CONTROLS'),
                        React.createElement('p', { className: 'text-sm text-gray-300' },
                            React.createElement('span', { className: 'text-yellow-300 font-bold' }, 'A/D'), ' Move | ',
                            React.createElement('span', { className: 'text-yellow-300 font-bold ml-2' }, 'W'), ' Jump | ',
                            React.createElement('span', { className: 'text-yellow-300 font-bold ml-2' }, 'J'), ' Punch | ',
                            React.createElement('span', { className: 'text-yellow-300 font-bold ml-2' }, 'K'), ' Kick | ',
                            React.createElement('span', { className: 'text-yellow-300 font-bold ml-2' }, 'F'), ' Fireball | ',
                            React.createElement('span', { className: 'text-yellow-300 font-bold ml-2' }, 'L'), ' Block | ',
                            React.createElement('span', { className: 'text-yellow-300 font-bold ml-2' }, 'T'), ' Transform'
                        )
                    ),

                    React.createElement('div', { className: 'text-center text-sm text-yellow-400 mb-3' },
                        '💥 Combos: ',
                        React.createElement('span', { className: 'text-pink-400' }, 'JJK'),
                        ' (+20dmg) | ',
                        React.createElement('span', { className: 'text-pink-400' }, 'KKJ'),
                        ' (+15dmg)'
                    ),

                    gameState !== 'playing' && React.createElement('div', { className: 'text-center' },
                        React.createElement('h1', { className: `text-6xl font-bold mb-4 ${gameState === 'p1-win' ? 'text-yellow-400' : 'text-red-500'}` },
                            gameState === 'p1-win' ? '🎉 VICTORY! 🎉' : '💀 DEFEAT 💀'
                        ),
                        React.createElement('button', { 
                            onClick: resetRound,
                            className: 'px-8 py-3 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 rounded-lg font-bold text-lg transition-all transform hover:scale-105'
                        }, 'NEXT ROUND')
                    )
                )
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(FighterGame));
    </script>
    <style>
        @keyframes float-up {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(10px); }
        }
    </style>
</body>
</html>

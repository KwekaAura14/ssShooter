<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fighter Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #0f172a 0%, #000000 50%, #0f172a 100%);
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 2px solid #dc2626;
        }

        .header-content {
            text-align: center;
            flex: 1;
        }

        .round-text {
            font-size: 0.875rem;
            color: #9ca3af;
        }

        .message {
            font-size: 1.875rem;
            font-weight: bold;
            color: #06b6d4;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            gap: 1rem;
        }

        .player-stats {
            flex: 1;
        }

        .player-name {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .stat-bar {
            background-color: #1f2937;
            border-radius: 0.5rem;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
        }

        .bar {
            width: 100%;
            background-color: #111827;
            border-radius: 0.25rem;
            height: 1.5rem;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            transition: width 0.3s ease;
        }

        .bar-hp-high {
            background: linear-gradient(90deg, #22c55e 0%, #4ade80 100%);
        }

        .bar-hp-med {
            background: linear-gradient(90deg, #eab308 0%, #facc15 100%);
        }

        .bar-hp-low {
            background: linear-gradient(90deg, #dc2626 0%, #ef4444 100%);
        }

        .bar-power {
            background: linear-gradient(90deg, #facc15 0%, #fde047 100%);
        }

        .power-bar {
            height: 1rem;
        }

        .combo-display {
            text-align: center;
            min-width: 150px;
        }

        .combo-text {
            font-size: 2.25rem;
            font-weight: bold;
            color: #fcd34d;
            margin-bottom: 0.5rem;
            animation: combo-pop 0.3s ease-out;
        }

        @keyframes combo-pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .max-combo {
            font-size: 0.875rem;
            color: #9ca3af;
        }

        .enemy-stats {
            flex: 1;
            text-align: right;
        }

        .arena {
            position: relative;
            flex: 1;
            background: linear-gradient(180deg, #7f1d1d 0%, #000000 100%);
            border: 4px solid #991b1b;
            overflow: hidden;
        }

        .fighter {
            position: absolute;
            bottom: 2.5rem;
            width: 6rem;
            height: 10rem;
            border-radius: 1rem;
            border: 4px solid white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .fighter-head {
            width: 4rem;
            height: 4rem;
            border-radius: 50%;
            margin-top: 0.5rem;
        }

        .fighter-body {
            width: 5rem;
            height: 5rem;
            border-radius: 0.75rem;
            margin-top: 0.5rem;
        }

        .player1 {
            background: linear-gradient(180deg, #3b82f6 0%, #1e40af 100%);
        }

        .player1-head {
            background-color: #fef08a;
        }

        .player1-body {
            background-color: #1e3a8a;
        }

        .player1.transformed {
            border-color: #fbbf24;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.8), 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .player1.transformed .player1-head {
            background-color: #fcd34d;
            box-shadow: 0 0 15px rgba(252, 211, 77, 0.8);
        }

        .player2 {
            background: linear-gradient(180deg, #dc2626 0%, #7f1d1d 100%);
        }

        .player2-head {
            background-color: #fed7aa;
        }

        .player2-body {
            background-color: #7c2d12;
        }

        .block-effect {
            position: absolute;
            inset: 0;
            border: 4px solid #06b6d4;
            border-radius: 1rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .sword-effect {
            position: absolute;
            font-size: 2rem;
            animation: shake 0.3s infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(0.625rem); }
        }

        .damage-text {
            position: absolute;
            font-weight: bold;
            font-size: 1.5rem;
            pointer-events: none;
            animation: float-up 1.5s ease-out forwards;
        }

        @keyframes float-up {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-6.25rem);
                opacity: 0;
            }
        }

        .damage-yellow {
            color: #fcd34d;
        }

        .damage-red {
            color: #fca5a5;
        }

        .damage-purple {
            color: #d8b4fe;
        }

        .controls {
            background-color: #111827;
            border-top: 2px solid #dc2626;
            padding: 1rem;
            text-align: center;
        }

        .controls-title {
            font-size: 1.125rem;
            font-weight: bold;
            color: #06b6d4;
            margin-bottom: 0.5rem;
        }

        .controls-text {
            font-size: 0.875rem;
            color: #d1d5db;
            margin-bottom: 0.75rem;
        }

        .key {
            color: #fcd34d;
            font-weight: bold;
        }

        .combos-text {
            font-size: 0.875rem;
            color: #fbbf24;
            margin-bottom: 0.75rem;
        }

        .combo-name {
            color: #ec4899;
        }

        .game-over {
            text-align: center;
            animation: scale-in 0.3s ease-out;
        }

        @keyframes scale-in {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .game-over-title {
            font-size: 3.75rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .victory {
            color: #fbbf24;
        }

        .defeat {
            color: #ef4444;
        }

        .next-round-btn {
            padding: 0.75rem 2rem;
            background: linear-gradient(90deg, #9333ea 0%, #ec4899 100%);
            border: none;
            border-radius: 0.5rem;
            color: white;
            font-weight: bold;
            font-size: 1.125rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .next-round-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(90deg, #7e22ce 0%, #be185d 100%);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="round-text">ROUND <span id="round">1</span></div>
                <div class="message" id="message">ROUND 1 - FIGHT!</div>
            </div>
        </div>

        <div class="hud">
            <div class="player-stats">
                <div class="player-name">PLAYER 1</div>
                <div class="stat-bar">
                    <div class="stat-label">
                        <span>HP</span>
                        <span><span id="p1hp">100</span>/100</span>
                    </div>
                    <div class="bar">
                        <div class="bar-fill bar-hp-high" id="p1hpbar" style="width: 100%"></div>
                    </div>
                </div>
                <div class="stat-bar">
                    <div class="stat-label">
                        <span>⚡ POWER</span>
                        <span><span id="p1power">0</span>/100</span>
                    </div>
                    <div class="bar">
                        <div class="bar-fill bar-power power-bar" id="p1powerbar" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div class="combo-display">
                <div class="combo-text" id="combotext" style="display: none;"></div>
                <div class="max-combo">Max Combo: <span id="maxcombo">0</span></div>
            </div>

            <div class="enemy-stats">
                <div class="player-name">ENEMY</div>
                <div class="stat-bar">
                    <div class="stat-label">
                        <span><span id="p2hp">100</span>/100</span>
                        <span>HP</span>
                    </div>
                    <div class="bar">
                        <div class="bar-fill bar-hp-high" id="p2hpbar" style="width: 100%"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="arena" id="arena"></div>

        <div class="controls">
            <div class="controls-title">CONTROLS</div>
            <div class="controls-text">
                <span class="key">A/D</span> Move |
                <span class="key">W</span> Jump |
                <span class="key">J</span> Punch |
                <span class="key">K</span> Kick |
                <span class="key">F</span> Fireball |
                <span class="key">L</span> Block |
                <span class="key">T</span> Transform
            </div>
            <div class="combos-text">
                💥 Combos: <span class="combo-name">JJK</span> (+20dmg) | <span class="combo-name">KKJ</span> (+15dmg)
            </div>
            <div id="gameover"></div>
        </div>
    </div>

    <script>
        const game = {
            p1: {
                hp: 100,
                maxHp: 100,
                x: 100,
                power: 0,
                transformed: false,
                jump: false,
                block: false,
                attacking: false,
                knockback: 0,
                stunned: 0
            },
            p2: {
                hp: 100,
                maxHp: 100,
                x: 650,
                transformed: false,
                attacking: false,
                knockback: 0,
                stunned: 0,
                actionCooldown: 0
            },
            msg: 'ROUND 1 - FIGHT!',
            combo: [],
            maxCombo: 0,
            round: 1,
            gameState: 'playing',
            effects: [],
            keysPressed: {}
        };

        const arena = document.getElementById('arena');

        function createFighter(type) {
            const div = document.createElement('div');
            div.className = `fighter ${type}`;
            div.innerHTML = `
                <div class="fighter-head ${type}-head"></div>
                <div class="fighter-body ${type}-body"></div>
            `;
            div.id = `${type}el`;
            arena.appendChild(div);
            return div;
        }

        createFighter('player1');
        createFighter('player2');

        function updateUI() {
            document.getElementById('p1hp').textContent = game.p1.hp;
            document.getElementById('p2hp').textContent = game.p2.hp;
            document.getElementById('p1power').textContent = game.p1.power;
            document.getElementById('message').textContent = game.msg;
            document.getElementById('round').textContent = game.round;
            document.getElementById('maxcombo').textContent = game.maxCombo;

            const hp1Percent = (game.p1.hp / game.p1.maxHp) * 100;
            const hp2Percent = (game.p2.hp / game.p2.maxHp) * 100;

            const p1hpbar = document.getElementById('p1hpbar');
            p1hpbar.style.width = Math.max(0, hp1Percent) + '%';
            p1hpbar.className = `bar-fill ${hp1Percent > 50 ? 'bar-hp-high' : hp1Percent > 25 ? 'bar-hp-med' : 'bar-hp-low'}`;

            const p2hpbar = document.getElementById('p2hpbar');
            p2hpbar.style.width = Math.max(0, hp2Percent) + '%';
            p2hpbar.className = `bar-fill ${hp2Percent > 50 ? 'bar-hp-high' : hp2Percent > 25 ? 'bar-hp-med' : 'bar-hp-low'}`;

            document.getElementById('p1powerbar').style.width = game.p1.power + '%';

            const p1el = document.getElementById('player1el');
            p1el.style.transform = `translateX(${game.p1.x + game.p1.knockback}px) translateY(${game.p1.jump ? -150 : 0}px) scale(${game.p1.transformed ? 1.5 : 1})`;

            if (game.p1.transformed) {
                p1el.style.borderColor = '#fbbf24';
                p1el.style.boxShadow = '0 0 30px rgba(251, 191, 36, 0.8), 0 20px 25px -5px rgba(0, 0, 0, 0.5)';
            } else {
                p1el.style.borderColor = 'white';
                p1el.style.boxShadow = '0 20px 25px -5px rgba(0, 0, 0, 0.5)';
            }

            const p2el = document.getElementById('player2el');
            p2el.style.transform = `translateX(${game.p2.x + game.p2.knockback}px) scale(${game.p2.transformed ? 1.2 : 1})`;

            // Block effect
            let blockEffect = p1el.querySelector('.block-effect');
            if (game.p1.block && !blockEffect) {
                blockEffect = document.createElement('div');
                blockEffect.className = 'block-effect';
                p1el.appendChild(blockEffect);
            } else if (!game.p1.block && blockEffect) {
                blockEffect.remove();
            }

            // Attack effect
            let swordEffect = p2el.querySelector('.sword-effect');
            if (game.p2.attacking && !swordEffect) {
                swordEffect = document.createElement('div');
                swordEffect.className = 'sword-effect';
                swordEffect.textContent = '⚔️';
                p2el.appendChild(swordEffect);
            } else if (!game.p2.attacking && swordEffect) {
                swordEffect.remove();
            }
        }

        function addEffect(x, y, text, color) {
            const el = document.createElement('div');
            el.className = `damage-text damage-${color}`;
            el.textContent = text;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            arena.appendChild(el);
            setTimeout(() => el.remove(), 1500);
        }

        function jump() {
            if (game.p1.jump || game.p1.stunned > 0) return;
            game.p1.jump = true;
            setTimeout(() => {
                game.p1.jump = false;
                updateUI();
            }, 500);
            updateUI();
        }

        function attack(key, dmg) {
            if (game.p1.attacking || game.p1.stunned > 0 || game.gameState !== 'playing') return;

            game.combo.push(key);
            if (game.combo.length > 3) game.combo.shift();

            let bonus = 0;
            if (game.combo.join('') === 'JJK') bonus = 20;
            if (game.combo.join('') === 'KKJ') bonus = 15;

            game.p1.attacking = true;
            setTimeout(() => {
                game.p1.attacking = false;
                updateUI();
            }, 300);

            if (Math.abs(game.p1.x - game.p2.x) < 90) {
                const totalDmg = dmg + bonus;
                game.p2.hp = Math.max(0, game.p2.hp - totalDmg);
                game.p2.knockback = 30;
                game.p2.stunned = bonus > 0 ? 3 : 1;
                game.p1.power = Math.min(100, game.p1.power + 15);

                addEffect(game.p2.x + 50, 150, totalDmg.toString(), bonus ? 'red' : 'yellow');

                if (bonus) {
                    game.msg = `COMBO x${game.combo.length}!`;
                    if (game.combo.length > game.maxCombo) game.maxCombo = game.combo.length;
                }
            }

            updateUI();
        }

        function fireball() {
            if (game.p1.power < 40 || game.p1.attacking || game.gameState !== 'playing') return;

            game.p1.power -= 40;
            game.p1.attacking = true;
            setTimeout(() => {
                game.p1.attacking = false;
                updateUI();
            }, 400);

            game.p2.hp = Math.max(0, game.p2.hp - 25);
            game.p2.knockback = 60;
            game.p2.stunned = 4;

            addEffect(game.p2.x, 100, 'FIREBALL!', 'yellow');
            game.msg = '🔥 FIREBALL! 🔥';
            updateUI();
        }

        function transform() {
            if (game.p1.power < 100 || game.p1.transformed || game.gameState !== 'playing') return;

            game.p1.transformed = true;
            game.p1.power = 0;
            game.msg = '⚡ ULTIMATE FORM! ⚡';

            addEffect(game.p1.x + 50, 200, 'TRANSFORMATION', 'purple');

            setTimeout(() => {
                game.p1.transformed = false;
                updateUI();
            }, 8000);

            updateUI();
        }

        function resetRound() {
            game.p1 = {
                hp: 100,
                maxHp: 100,
                x: 100,
                power: 0,
                transformed: false,
                jump: false,
                block: false,
                attacking: false,
                knockback: 0,
                stunned: 0
            };
            game.p2 = {
                hp: 100,
                maxHp: 100,
                x: 650,
                transformed: false,
                attacking: false,
                knockback: 0,
                stunned: 0,
                actionCooldown: 0
            };
            game.combo = [];
            game.round++;
            game.gameState = 'playing';
            game.msg = `ROUND ${game.round} - FIGHT!`;
            document.getElementById('gameover').innerHTML = '';
            updateUI();
        }

        // Keyboard input
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            game.keysPressed[key] = true;

            if (game.gameState !== 'playing') return;

            if (key === 'a') game.p1.x = Math.max(0, game.p1.x - 25);
            if (key === 'd') game.p1.x = Math.min(700, game.p1.x + 25);
            if (key === 'w') jump();
            if (key === 'l') game.p1.block = true;
            if (key === 'j') attack('J', 10);
            if (key === 'k') attack('K', 18);
            if (key === 'f') fireball();
            if (key === 't') transform();

            updateUI();
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            game.keysPressed[key] = false;

            if (key === 'l') game.p1.block = false;
            updateUI();
        });

        // Continuous movement
        setInterval(() => {
            if (game.keysPressed['a']) game.p1.x = Math.max(0, game.p1.x - 15);
            if (game.keysPressed['d']) game.p1.x = Math.min(700, game.p1.x + 15);
            updateUI();
        }, 50);

        // AI Logic
        setInterval(() => {
            if (game.gameState !== 'playing') return;

            if (game.p2.stunned > 0) {
                game.p2.stunned--;
                return;
            }
            if (game.p2.actionCooldown > 0) {
                game.p2.actionCooldown--;
                return;
            }

            const distance = Math.abs(game.p2.x - game.p1.x);
            if (distance > 120) {
                game.p2.x += game.p2.x > game.p1.x ? -18 : 18;
                game.p2.x = Math.max(0, Math.min(700, game.p2.x));
                game.p2.attacking = false;
            }

            const random = Math.random();
            if (distance < 90 && random > 0.7) {
                const damage = random > 0.85 ? 18 : 10;
                const actualDamage = game.p1.block ? Math.ceil(damage * 0.3) : damage;
                game.p1.hp = Math.max(0, game.p1.hp - actualDamage);
                game.p1.stunned = 2;
                game.p2.actionCooldown = 8;
                game.p2.attacking = true;
            } else if (game.p2.hp < 40 && random > 0.6 && game.p2.power >= 25) {
                game.p1.hp = Math.max(0, game.p1.hp - 20);
                game.p2.actionCooldown = 10;
                game.p2.power -= 25;
            }

            updateUI();
        }, 600);

        // Check game state
        setInterval(() => {
            if (game.p1.hp <= 0 && game.gameState === 'playing') {
                game.gameState = 'p2-win';
                game.msg = 'GAME OVER - YOU LOSE!';
                const gameoverDiv = document.getElementById('gameover');
                gameoverDiv.innerHTML = `
                    <div class="game-over">
                        <div class="game-over-title defeat">💀 DEFEAT 💀</div>
                        <button class="next-round-btn" onclick="resetRound()">NEXT ROUND</button>
                    </div>
                `;
                updateUI();
            } else if (game.p2.hp <= 0 && game.gameState === 'playing') {
                game.gameState = 'p1-win';
                game.msg = 'VICTORY!';
                const gameoverDiv = document.getElementById('gameover');
                gameoverDiv.innerHTML = `
                    <div class="game-over">
                        <div class="game-over-title victory">🎉 VICTORY! 🎉</div>
                        <button class="next-round-btn" onclick="resetRound()">NEXT ROUND</button>
                    </div>
                `;
                updateUI();
            }
        }, 100);

        updateUI();
    </script>
</body>
</html>

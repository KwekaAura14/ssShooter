<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Functional GitHub AI Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e2e; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 400px; height: 500px; background: #252538; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px; border-radius: 8px; max-width: 80%; word-wrap: break-word; }
        .user { background: #007aff; align-self: flex-end; }
        .ai { background: #444465; align-self: flex-start; }
        .input-area { display: flex; padding: 10px; background: #181824; }
        input { flex: 1; padding: 10px; border: none; border-radius: 5px; background: #2a2a3d; color: white; }
        button { background: #007aff; color: white; border: none; padding: 10px 15px; margin-left: 5px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-box" id="chatBox">
        <div class="message ai">Hello! I am a functional AI running right from the web code. Ask me anything!</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type a message...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
async function sendMessage() {
    const input = document.getElementById('userInput');
    const chatBox = document.getElementById('chatBox');
    const userText = input.value.trim();
    if (!userText) return;

    // 1. Append User Message
    chatBox.innerHTML += `<div class="message user">${userText}</div>`;
    input.value = '';
    chatBox.scrollTop = chatBox.scrollHeight;

    // 2. Append Temporary AI Thinking State
    const aiMessageDiv = document.createElement('div');
    aiMessageDiv.className = 'message ai';
    aiMessageDiv.innerText = 'Thinking...';
    chatBox.appendChild(aiMessageDiv);

    try {
        // 3. Connect to a free, zero-key public text processing API
        const response = await fetch(`https://duckduckgo.com{encodeURIComponent(userText)}&format=json`);
        const data = await response.json();
        
        // Use basic fallback programmatic intelligence if API abstract is blank
        const reply = data.AbstractText || "I received your message! To get advanced answers, plug a real OpenAI or Anthropic API Key into this fetch request.";
        aiMessageDiv.innerText = reply;
    } catch (error) {
        aiMessageDiv.innerText = "Error connecting to the AI processing server.";
    }
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>

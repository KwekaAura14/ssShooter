<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fighter Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #0f172a 0%, #000000 50%, #0f172a 100%);
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 2px solid #dc2626;
        }

        .header-content {
            text-align: center;
            flex: 1;
        }

        .round-text {
            font-size: 0.875rem;
            color: #9ca3af;
        }

        .message {
            font-size: 1.875rem;
            font-weight: bold;
            color: #06b6d4;
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            gap: 1rem;
        }

        .player-stats {
            flex: 1;
        }

        .player-name {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #60a5fa;
        }

        .stat-bar {
            background-color: #1f2937;
            border-radius: 0.5rem;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            border: 2px solid #374151;
        }

        .stat-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
        }

        .bar {
            width: 100%;
            background-color: #111827;
            border-radius: 0.25rem;
            height: 1.5rem;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            transition: width 0.3s ease;
        }

        .bar-hp-high {
            background: linear-gradient(90deg, #22c55e 0%, #4ade80 100%);
        }

        .bar-hp-med {
            background: linear-gradient(90deg, #eab308 0%, #facc15 100%);
        }

        .bar-hp-low {
            background: linear-gradient(90deg, #dc2626 0%, #ef4444 100%);
        }

        .bar-power {
            background: linear-gradient(90deg, #facc15 0%, #fde047 100%);
            box-shadow: 0 0 10px rgba(253, 224, 71, 0.5);
        }

        .power-bar {
            height: 1rem;
        }

        .combo-display {
            text-align: center;
            min-width: 150px;
        }

        .combo-text {
            font-size: 2.25rem;
            font-weight: bold;
            color: #fcd34d;
            margin-bottom: 0.5rem;
            animation: combo-pop 0.3s ease-out;
            text-shadow: 0 0 10px rgba(252, 211, 77, 0.8);
        }

        @keyframes combo-pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .max-combo {
            font-size: 0.875rem;
            color: #9ca3af;
        }

        .enemy-stats {
            flex: 1;
            text-align: right;
        }

        .enemy-name {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #f87171;
        }

        .arena {
            position: relative;
            flex: 1;
            background: linear-gradient(180deg, #7f1d1d 0%, #1a1a1a 50%, #000000 100%);
            border: 4px solid #991b1b;
            overflow: hidden;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .controls {
            background-color: #111827;
            border-top: 2px solid #dc2626;
            padding: 1rem;
            text-align: center;
        }

        .controls-title {
            font-size: 1.125rem;
            font-weight: bold;
            color: #06b6d4;
            margin-bottom: 0.5rem;
        }

        .controls-text {
            font-size: 0.875rem;
            color: #d1d5db;
            margin-bottom: 0.75rem;
        }

        .key {
            color: #fcd34d;
            font-weight: bold;
        }

        .combos-text {
            font-size: 0.875rem;
            color: #fbbf24;
            margin-bottom: 0.75rem;
        }

        .combo-name {
            color: #ec4899;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.95);
            padding: 2rem;
            border-radius: 1rem;
            border: 3px solid #fbbf24;
            z-index: 1000;
            animation: scale-in 0.3s ease-out;
        }

        @keyframes scale-in {
            0% { transform: translate(-50%, -50%) scale(0); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .game-over-title {
            font-size: 3.75rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .victory {
            color: #fbbf24;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.8);
        }

        .defeat {
            color: #ef4444;
            text-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
        }

        .next-round-btn {
            padding: 0.75rem 2rem;
            background: linear-gradient(90deg, #9333ea 0%, #ec4899 100%);
            border: none;
            border-radius: 0.5rem;
            color: white;
            font-weight: bold;
            font-size: 1.125rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .next-round-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(90deg, #7e22ce 0%, #be185d 100%);
        }

        .damage-popup {
            position: absolute;
            font-weight: bold;
            font-size: 1.5rem;
            pointer-events: none;
            animation: float-up 1.5s ease-out forwards;
        }

        @keyframes float-up {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-6.25rem);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="round-text">ROUND <span id="round">1</span></div>
                <div class="message" id="message">ROUND 1 - FIGHT!</div>
            </div>
        </div>

        <div class="hud">
            <div class="player-stats">
                <div class="player-name">PLAYER 1</div>
                <div class="stat-bar">
                    <div class="stat-label">
                        <span>HP</span>
                        <span><span id="p1hp">100</span>/100</span>
                    </div>
                    <div class="bar">
                        <div class="bar-fill bar-hp-high" id="p1hpbar" style="width: 100%"></div>
                    </div>
                </div>
                <div class="stat-bar">
                    <div class="stat-label">
                        <span>⚡ POWER</span>
                        <span><span id="p1power">0</span>/100</span>
                    </div>
                    <div class="bar">
                        <div class="bar-fill bar-power power-bar" id="p1powerbar" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div class="combo-display">
                <div class="combo-text" id="combotext" style="display: none;"></div>
                <div class="max-combo">Max Combo: <span id="maxcombo">0</span></div>
            </div>

            <div class="enemy-stats">
                <div class="enemy-name">ENEMY</div>
                <div class="stat-bar">
                    <div class="stat-label">
                        <span><span id="p2hp">100</span>/100</span>
                        <span>HP</span>
                    </div>
                    <div class="bar">
                        <div class="bar-fill bar-hp-high" id="p2hpbar" style="width: 100%"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="arena" id="arena">
            <canvas id="gameCanvas"></canvas>
            <div id="gameoverContainer"></div>
        </div>

        <div class="controls">
            <div class="controls-title">CONTROLS</div>
            <div class="controls-text">
                <span class="key">W/A/S/D</span> Move |
                <span class="key">SPACE</span> Jump |
                <span class="key">J</span> Punch |
                <span class="key">K</span> Kick |
                <span class="key">F</span> Fireball |
                <span class="key">L</span> Block |
                <span class="key">T</span> Transform
            </div>
            <div class="combos-text">
                💥 Combos: <span class="combo-name">JJK</span> (+20dmg) | <span class="combo-name">KKJ</span> (+15dmg)
            </div>
        </div>
    </div>

    <script src="game.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        // Initialize managers
        const particleSystem = new ParticleSystem();
        const soundManager = new SoundManager();
        const gameStateManager = new GameStateManager();

        // Add groundLevel to players
        const groundLevel = canvas.height - 120;

        const game = {
            p1: {
                hp: 100,
                maxHp: 100,
                x: 150,
                y: 0,
                vx: 0,
                vy: 0,
                power: 0,
                transformed: false,
                jump: false,
                block: false,
                attacking: false,
                attackFrame: 0,
                knockback: 0,
                stunned: 0,
                direction: 1,
                animationFrame: 0,
                state: 'idle',
                groundLevel: groundLevel
            },
            p2: {
                hp: 100,
                maxHp: 100,
                x: canvas.width - 150,
                y: 0,
                vx: 0,
                vy: 0,
                power: 0,
                transformed: false,
                attacking: false,
                attackFrame: 0,
                knockback: 0,
                stunned: 0,
                direction: -1,
                animationFrame: 0,
                state: 'idle',
                actionCooldown: 0,
                groundLevel: groundLevel
            },
            msg: 'ROUND 1 - FIGHT!',
            combo: [],
            maxCombo: 0,
            round: 1,
            gameState: 'playing',
            keysPressed: {},
            gravity: 0.6,
            groundLevel: groundLevel
        };

        function drawGround() {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, game.groundLevel, canvas.width, canvas.height - game.groundLevel);

            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, game.groundLevel);
            ctx.lineTo(canvas.width, game.groundLevel);
            ctx.stroke();
        }

        function updateUI() {
            document.getElementById('p1hp').textContent = Math.max(0, game.p1.hp);
            document.getElementById('p2hp').textContent = Math.max(0, game.p2.hp);
            document.getElementById('p1power').textContent = game.p1.power;
            document.getElementById('message').textContent = game.msg;
            document.getElementById('round').textContent = game.round;
            document.getElementById('maxcombo').textContent = game.maxCombo;

            const hp1Percent = (Math.max(0, game.p1.hp) / game.p1.maxHp) * 100;
            const hp2Percent = (Math.max(0, game.p2.hp) / game.p2.maxHp) * 100;

            const p1hpbar = document.getElementById('p1hpbar');
            p1hpbar.style.width = hp1Percent + '%';
            p1hpbar.className = `bar-fill ${hp1Percent > 50 ? 'bar-hp-high' : hp1Percent > 25 ? 'bar-hp-med' : 'bar-hp-low'}`;

            const p2hpbar = document.getElementById('p2hpbar');
            p2hpbar.style.width = hp2Percent + '%';
            p2hpbar.className = `bar-fill ${hp2Percent > 50 ? 'bar-hp-high' : hp2Percent > 25 ? 'bar-hp-med' : 'bar-hp-low'}`;

            document.getElementById('p1powerbar').style.width = game.p1.power + '%';
        }

        function addDamagePopup(x, y, text, color) {
            const popup = document.createElement('div');
            popup.className = 'damage-popup';
            popup.textContent = text;
            popup.style.left = x + 'px';
            popup.style.top = y + 'px';
            popup.style.color = color;
            popup.style.textShadow = `0 0 10px ${color}`;
            document.getElementById('arena').appendChild(popup);
            setTimeout(() => popup.remove(), 1500);
        }

        function attack(key, dmg) {
            if (game.p1.attacking || game.p1.stunned > 0 || game.gameState !== 'playing') return;

            game.combo.push(key);
            if (game.combo.length > 3) game.combo.shift();

            let bonus = 0;
            if (game.combo.join('') === 'JJK') bonus = 20;
            if (game.combo.join('') === 'KKJ') bonus = 15;

            game.p1.attacking = true;
            game.p1.state = 'attacking';
            game.p1.attackFrame = 0;

            setTimeout(() => {
                game.p1.attacking = false;
                game.p1.state = 'idle';
            }, 300);

            if (Math.abs(game.p1.x - game.p2.x) < 100) {
                const totalDmg = dmg + bonus;
                game.p2.hp = Math.max(0, game.p2.hp - totalDmg);
                game.p2.knockback = 50 * game.p2.direction;
                game.p2.stunned = bonus > 0 ? 5 : 2;
                game.p2.state = 'hurt';
                game.p1.power = Math.min(100, game.p1.power + 15);

                // Add particles
                particleSystem.emit(game.p2.x, game.p2.y + game.groundLevel - 80, 15, {
                    vxRange: [-6, 6],
                    vyRange: [-8, -2],
                    color: bonus ? '#FF6B6B' : '#FFD700',
                    sizeRange: [2, 6],
                    lifetime: 800
                });

                addDamagePopup(game.p2.x, game.groundLevel - 80, totalDmg.toString(), bonus ? '#ff6b6b' : '#fcd34d');

                if (bonus) {
                    game.msg = `COMBO x${game.combo.length}!`;
                    if (game.combo.length > game.maxCombo) game.maxCombo = game.combo.length;
                }
            }

            updateUI();
        }

        function fireball() {
            if (game.p1.power < 40 || game.p1.attacking || game.gameState !== 'playing') return;

            game.p1.power -= 40;
            game.p1.attacking = true;
            game.p1.state = 'attacking';
            game.p1.attackFrame = 0;

            setTimeout(() => {
                game.p1.attacking = false;
                game.p1.state = 'idle';
            }, 400);

            game.p2.hp = Math.max(0, game.p2.hp - 25);
            game.p2.knockback = 80 * game.p2.direction;
            game.p2.stunned = 5;
            game.p2.state = 'hurt';

            // Large explosion particles
            particleSystem.emit(game.p2.x, game.p2.y + game.groundLevel - 100, 30, {
                vxRange: [-8, 8],
                vyRange: [-10, -3],
                color: '#FF9F1C',
                sizeRange: [3, 10],
                lifetime: 1200
            });

            addDamagePopup(game.p2.x, game.groundLevel - 100, 'FIREBALL!', '#ff9f1c');
            game.msg = '🔥 FIREBALL! 🔥';
            updateUI();
        }

        function transform() {
            if (game.p1.power < 100 || game.p1.transformed || game.gameState !== 'playing') return;

            game.p1.transformed = true;
            game.p1.power = 0;
            game.msg = '⚡ ULTIMATE FORM! ⚡';

            // Transformation particles
            particleSystem.emit(game.p1.x, game.p1.y + game.groundLevel - 120, 40, {
                vxRange: [-10, 10],
                vyRange: [-12, -5],
                color: '#FCD34D',
                sizeRange: [2, 8],
                lifetime: 1500
            });

            addDamagePopup(game.p1.x, game.groundLevel - 120, 'TRANSFORMATION', '#fcd34d');

            setTimeout(() => {
                game.p1.transformed = false;
                updateUI();
            }, 8000);

            updateUI();
        }

        function resetRound() {
            game.p1 = {
                hp: 100,
                maxHp: 100,
                x: 150,
                y: 0,
                vx: 0,
                vy: 0,
                power: 0,
                transformed: false,
                jump: false,
                block: false,
                attacking: false,
                attackFrame: 0,
                knockback: 0,
                stunned: 0,
                direction: 1,
                animationFrame: 0,
                state: 'idle',
                groundLevel: groundLevel
            };
            game.p2 = {
                hp: 100,
                maxHp: 100,
                x: canvas.width - 150,
                y: 0,
                vx: 0,
                vy: 0,
                power: 0,
                transformed: false,
                attacking: false,
                attackFrame: 0,
                knockback: 0,
                stunned: 0,
                direction: -1,
                animationFrame: 0,
                state: 'idle',
                actionCooldown: 0,
                groundLevel: groundLevel
            };
            game.combo = [];
            game.round++;
            game.gameState = 'playing';
            game.msg = `ROUND ${game.round} - FIGHT!`;
            document.getElementById('gameoverContainer').innerHTML = '';
            particleSystem.particles = [];
            updateUI();
        }

        // Keyboard input
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            game.keysPressed[key] = true;

            if (game.gameState !== 'playing') return;

            if (key === ' ') {
                e.preventDefault();
                if (!game.p1.jump) {
                    game.p1.jump = true;
                    game.p1.vy = -15;
                    game.p1.state = 'jumping';
                }
            }
            if (key === 'l') game.p1.block = true;
            if (key === 'j') attack('J', 10);
            if (key === 'k') attack('K', 18);
            if (key === 'f') fireball();
            if (key === 't') transform();
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            game.keysPressed[key] = false;

            if (key === 'l') game.p1.block = false;
        });

        function updateGame() {
            // Player 1 movement
            if (game.keysPressed['a']) {
                game.p1.vx = -8;
                game.p1.direction = -1;
                game.p1.state = game.p1.state !== 'attacking' ? 'walking' : 'attacking';
            } else if (game.keysPressed['d']) {
                game.p1.vx = 8;
                game.p1.direction = 1;
                game.p1.state = game.p1.state !== 'attacking' ? 'walking' : 'attacking';
            } else {
                game.p1.vx *= 0.8;
                if (game.p1.state === 'walking' && !game.p1.attacking) {
                    game.p1.state = 'idle';
                }
            }

            // Apply gravity
            game.p1.vy += game.gravity;
            game.p1.y += game.p1.vy;

            if (game.p1.y >= 0) {
                game.p1.y = 0;
                game.p1.vy = 0;
                game.p1.jump = false;
                if (game.p1.state === 'jumping') {
                    game.p1.state = 'idle';
                }
            }

            // Apply knockback
            if (game.p1.knockback !== 0) {
                game.p1.x += game.p1.knockback;
                game.p1.knockback *= 0.9;
                if (Math.abs(game.p1.knockback) < 1) game.p1.knockback = 0;
            }

            game.p1.x += game.p1.vx;
            game.p1.x = Math.max(30, Math.min(canvas.width - 30, game.p1.x));

            if (game.p1.stunned > 0) game.p1.stunned--;

            // AI Logic for P2
            if (game.gameState === 'playing') {
                if (game.p2.stunned > 0) {
                    game.p2.stunned--;
                } else if (game.p2.actionCooldown > 0) {
                    game.p2.actionCooldown--;
                } else {
                    const distance = Math.abs(game.p2.x - game.p1.x);
                    
                    if (distance > 120) {
                        game.p2.vx = game.p2.x > game.p1.x ? -6 : 6;
                        game.p2.state = 'walking';
                        game.p2.direction = game.p2.x > game.p1.x ? -1 : 1;
                    } else {
                        game.p2.vx *= 0.8;
                        game.p2.state = 'idle';
                    }

                    const random = Math.random();
                    if (distance < 100 && random > 0.75) {
                        const damage = random > 0.87 ? 18 : 10;
                        const actualDamage = game.p1.block ? Math.ceil(damage * 0.3) : damage;
                        game.p1.hp = Math.max(0, game.p1.hp - actualDamage);
                        game.p1.knockback = 30 * game.p1.direction;
                        game.p1.stunned = 3;
                        game.p1.state = 'hurt';
                        game.p2.state = 'attacking';
                        game.p2.attackFrame = 0;
                        game.p2.actionCooldown = 8;

                        // Enemy attack particles
                        particleSystem.emit(game.p1.x, game.p1.y + game.groundLevel - 80, 10, {
                            vxRange: [-5, 5],
                            vyRange: [-6, -1],
                            color: '#FCA5A5',
                            sizeRange: [2, 5],
                            lifetime: 600
                        });

                        addDamagePopup(game.p1.x, game.groundLevel - 80, actualDamage.toString(), '#fca5a5');
                    } else if (game.p2.hp < 40 && random > 0.65) {
                        game.p1.hp = Math.max(0, game.p1.hp - 20);
                        game.p1.knockback = 50 * game.p1.direction;
                        game.p1.stunned = 4;
                        game.p2.actionCooldown = 10;

                        addDamagePopup(game.p1.x, game.groundLevel - 100, '20', '#ff9f1c');
                    }
                }

                // P2 Physics
                game.p2.vy += game.gravity;
                game.p2.y += game.p2.vy;

                if (game.p2.y >= 0) {
                    game.p2.y = 0;
                    game.p2.vy = 0;
                }

                if (game.p2.knockback !== 0) {
                    game.p2.x += game.p2.knockback;
                    game.p2.knockback *= 0.9;
                    if (Math.abs(game.p2.knockback) < 1) game.p2.knockback = 0;
                }

                game.p2.x += game.p2.vx;
                game.p2.x = Math.max(30, Math.min(canvas.width - 30, game.p2.x));
            }

            // Animation frame updates
            if (game.p1.state === 'walking') game.p1.animationFrame++;
            if (game.p1.state === 'attacking') game.p1.attackFrame++;
            if (game.p2.state === 'attacking') game.p2.attackFrame++;
            if (game.p2.state === 'walking') game.p2.animationFrame++;

            // Update particles
            particleSystem.update(16);

            // Check game over
            if (game.p1.hp <= 0 && game.gameState === 'playing') {
                game.gameState = 'p2-win';
                game.msg = 'GAME OVER - YOU LOSE!';
                showGameOver(false);
            } else if (game.p2.hp <= 0 && game.gameState === 'playing') {
                game.gameState = 'p1-win';
                game.msg = 'VICTORY!';
                showGameOver(true);
            }
        }

        function showGameOver(isVictory) {
            const container = document.getElementById('gameoverContainer');
            const div = document.createElement('div');
            div.className = 'game-over';
            div.innerHTML = `
                <div class="game-over-title ${isVictory ? 'victory' : 'defeat'}">
                    ${isVictory ? '🎉 VICTORY! 🎉' : '💀 DEFEAT 💀'}
                </div>
                <button class="next-round-btn" onclick="resetRound()">NEXT ROUND</button>
            `;
            container.appendChild(div);
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = 'rgba(15, 23, 42, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw ground
            drawGround();

            // Draw characters with enhanced renderer
            CharacterRenderer.drawCharacter(ctx, game.p1, game.p1.transformed);
            CharacterRenderer.drawCharacter(ctx, game.p2);

            // Draw particles
            particleSystem.draw(ctx);

            updateGame();
            updateUI();

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
